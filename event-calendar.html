<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="이벤트 기반 뉴스·시즌 캘린더 — 상품별 문구 추천(규칙 기반·사람 검토 전)">
<title>Modooflow · 뉴스·시즌 이벤트 캘린더</title>
<style>
@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:url('fonts/PretendardVariable.woff2') format('woff2-variations');}
:root{
  --brand:#0ea5a0; --brand-600:#0b7f7b; --brand-50:#dff5f3; --brand-tint:#eefaf9;
  --grad:linear-gradient(135deg,#22b8b2 0%,#0ea5a0 100%);
  --ink:#0f1729; --ink-2:#4a5163; --muted:#8b93a3; --faint:#cdd2db;
  --bg:#f7f8fa; --surface:#fff; --surface-2:#f4f6f8; --line:#e8ebef; --line-2:#eef1f4;
  --good:#1f9d6b; --good-bg:#e4f6ee; --mid:#c47f12; --mid-bg:#fbf1de; --bad:#d64545; --bad-bg:#fbe7e4;
  --up:#6366f1; --up-bg:#e8e9fd; --act:#0ea5a0; --act-bg:#dff5f3; --end:#8b93a3; --end-bg:#eef1f4; --fu:#c47f12; --fu-bg:#fbf1de;
  --r:14px; --r-sm:10px; --sh:0 1px 2px rgba(15,23,41,.04),0 2px 6px rgba(15,23,41,.05);
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:'Pretendard Variable','Pretendard','Noto Sans KR','Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){:root{--ink:#eef1f6;--ink-2:#b7bdc9;--muted:#7f8697;--faint:#4a4f60;--bg:#0e1016;--surface:#171a21;--surface-2:#1d212a;--line:#262b35;--line-2:#20242d;--brand-50:#0c2b2a;--brand-tint:#0c1f1e;--good-bg:#122c20;--mid-bg:#2e2410;--bad-bg:#331817;--up-bg:#1e1f45;--act-bg:#0c2b2a;--end-bg:#20242d;--fu-bg:#2e2410;--sh:0 1px 2px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{--ink:#eef1f6;--ink-2:#b7bdc9;--muted:#7f8697;--faint:#4a4f60;--bg:#0e1016;--surface:#171a21;--surface-2:#1d212a;--line:#262b35;--line-2:#20242d;--brand-50:#0c2b2a;--brand-tint:#0c1f1e;--good-bg:#122c20;--mid-bg:#2e2410;--bad-bg:#331817;--up-bg:#1e1f45;--act-bg:#0c2b2a;--end-bg:#20242d;--fu-bg:#2e2410;--sh:0 1px 2px rgba(0,0,0,.4);}
:root[data-theme="light"]{--ink:#0f1729;--ink-2:#4a5163;--muted:#8b93a3;--faint:#cdd2db;--bg:#f7f8fa;--surface:#fff;--surface-2:#f4f6f8;--line:#e8ebef;--line-2:#eef1f4;--brand-50:#dff5f3;--brand-tint:#eefaf9;--good-bg:#e4f6ee;--mid-bg:#fbf1de;--bad-bg:#fbe7e4;--up-bg:#e8e9fd;--act-bg:#dff5f3;--end-bg:#eef1f4;--fu-bg:#fbf1de;--sh:0 1px 2px rgba(15,23,41,.04),0 2px 6px rgba(15,23,41,.05);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.011em;word-break:keep-all;}
.main{min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--line);}
.brand-logo{width:32px;height:32px;border-radius:9px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;}
#pt{font-size:16px;font-weight:800;letter-spacing:-.02em;} .crumb{font-size:12px;color:var(--muted);text-decoration:none;font-weight:700;}
.tr{margin-left:auto;display:flex;gap:8px;align-items:center;}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:14px;}
.wrap{padding:18px 22px 60px;max-width:1080px;width:100%;margin:0 auto;}
.banner{background:var(--mid-bg);border:1px solid color-mix(in srgb,var(--mid) 30%,var(--line));border-radius:var(--r-sm);padding:10px 14px;font-size:12px;color:var(--ink-2);margin-bottom:14px;line-height:1.6;}
.banner b{color:var(--mid);}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px;}
@media(max-width:640px){.kpis{grid-template-columns:1fr 1fr;}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);}
.kpi .n{font-family:var(--mono);font-size:20px;font-weight:800;} .kpi .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:4px;}
.filters{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.fgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.fgroup .lb{font-size:10.5px;font-weight:800;color:var(--muted);}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:11.5px;font-weight:700;cursor:pointer;}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}
select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 9px;font-family:inherit;font-size:12px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);margin-bottom:11px;}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.st{font-size:10px;font-weight:800;padding:2px 9px;border-radius:99px;}
.st.upcoming,.st.emerging{background:var(--up-bg);color:var(--up);} .st.active{background:var(--act-bg);color:var(--act);}
.st.cooling,.st.ended{background:var(--end-bg);color:var(--end);} .st.follow_up{background:var(--fu-bg);color:var(--fu);}
.ev{font-size:11px;color:var(--muted);font-weight:700;} .prod{font-size:13px;font-weight:800;}
.conf{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:800;color:var(--brand-600);}
.tr-chip{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--brand-50);color:var(--brand-600);}
.tabs{display:flex;gap:8px;margin-bottom:14px;border-bottom:1px solid var(--line);}
.tab{padding:9px 14px;border:0;background:none;color:var(--muted);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.on{color:var(--brand-600);border-bottom-color:var(--brand);}
.mstrip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:6px 0;}
.mstrip .ms{font-size:9.5px;font-weight:800;text-align:center;padding:3px 0;border-radius:5px;background:var(--surface-2);color:var(--faint);}
.mstrip .ms.on{background:var(--brand-50);color:var(--brand-600);}
.mstrip .ms.cur{outline:2px solid var(--brand);outline-offset:-2px;}
.tline{display:flex;gap:8px;align-items:flex-start;margin:5px 0;font-size:13px;}
.tline .k{flex:0 0 40px;font-size:10.5px;font-weight:800;color:var(--muted);padding-top:2px;}
.tline .v{flex:1;color:var(--ink);} .tline .cp{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:6px;padding:2px 8px;font-size:10.5px;font-weight:700;cursor:pointer;}
.meta{margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2);font-size:11px;color:var(--ink-2);line-height:1.7;}
.meta b{color:var(--ink);} .meta .rev{color:var(--mid);font-weight:800;} .meta .avoid{color:var(--bad);}
.fact{font-size:11px;color:var(--muted);line-height:1.6;margin-top:2px;}
.sec-lbl{font-size:12px;font-weight:800;color:var(--ink-2);margin:22px 0 10px;} .sec-lbl b{color:var(--brand-600);}
.uc{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--mid);border-radius:var(--r-sm);padding:9px 13px;margin-bottom:7px;font-size:12px;}
.uc .t{font-weight:700;} .uc .m{font-size:10.5px;color:var(--muted);}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px;}
.foot{font-size:10.5px;color:var(--muted);margin-top:22px;border-top:1px solid var(--line);padding-top:12px;line-height:1.6;}
.foot a{color:var(--brand-600);font-weight:700;text-decoration:none;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("mf_theme")||"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
</head>
<body>
<main class="main">
  <header class="topbar">
    <div class="brand-logo">🗓️</div>
    <div><a class="crumb" href="index.html">Modooflow ›</a><div id="pt">뉴스·시즌 이벤트 캘린더</div></div>
    <div class="tr"><button class="icon-btn" id="themeBtn" title="테마">◐</button></div>
  </header>
  <div class="wrap" id="wrap"><div class="empty">불러오는 중…</div></div>
</main>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let DATA={recommendations:[],unclassified:[],events:[],transitions:[],counts:{},asof:""};
let F={win:"7", state:"all", product:"all", event:"all"};
let TAB="reco", SEASON=null, PRODNAMES={};
const STGROUP={upcoming:"예정",emerging:"예정",active:"진행",cooling:"종료",ended:"종료",follow_up:"후속"};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1500);}
function tabBar(){return `<div class="tabs"><button class="tab${TAB==="reco"?" on":""}" data-tab="reco">📰 뉴스·추천 문구</button><button class="tab${TAB==="season"?" on":""}" data-tab="season">📅 시즌 캘린더</button></div>`;}
function render(){TAB==="season"?renderSeason():renderReco();window.scrollTo({top:0});}
function mrange(ms){const s=(ms||[]).slice().sort((a,b)=>a-b);let out=[],i=0;while(i<s.length){let j=i;while(j+1<s.length&&s[j+1]===s[j]+1)j++;out.push(s[i]===s[j]?`${s[i]}월`:`${s[i]}~${s[j]}월`);i=j+1;}return out.join(", ");}
function curMonth(){const t=DATA.asof?new Date(DATA.asof+"T00:00:00"):new Date();return t.getMonth()+1;}
function spanText(w){return (w.span||[]).map(sp=>`${String(sp[0]).replace("-","/")}~${String(sp[1]).replace("-","/")}`).join(", ");}
function monthStrip(w){const cur=curMonth();let c="";for(let m=1;m<=12;m++){const on=(w.m||[]).includes(m);c+=`<span class="ms${on?" on":""}${m===cur?" cur":""}">${m}</span>`;}return `<div class="mstrip">${c}</div>`;}
function renderSeason(){
  const w=$("#wrap");
  if(!SEASON){w.innerHTML=tabBar()+`<div class="empty">시즌 데이터 불러오는 중…</div>`;
    fetch("data/seasonal.json").then(r=>r.json()).then(d=>{SEASON=d.seasonal||{};renderSeason();})
      .catch(()=>{w.innerHTML=tabBar()+`<div class="banner">${location.protocol==="file:"?`⚠️ <b>로컬 파일로 열림.</b> <code>data/seasonal.json</code> 로드 불가 — 배포 주소로 여세요.`:"시즌 데이터를 불러올 수 없습니다."}</div>`;});
    return;}
  const cur=curMonth(),pname=pk=>PRODNAMES[pk]||pk;
  const now=[];Object.entries(SEASON).forEach(([pk,wins])=>(wins||[]).forEach(x=>{if((x.m||[]).includes(cur))now.push({pk,w:x});}));
  const blocks=Object.entries(SEASON).map(([pk,wins])=>`<div class="sec-lbl" style="margin-top:18px">${esc(pname(pk))}</div>`+
    (wins||[]).map(x=>`<div class="card">
      <div class="card-h"><span class="prod">${esc(x.tag)}</span>${x.span?`<span class="tr-chip" title="정확 일자 기간">🗓️ ${esc(spanText(x))}</span>`:`<span class="ev">${esc(mrange(x.m))}</span>`}${(x.m||[]).includes(cur)?`<span class="st active">이번 달</span>`:""}</div>
      ${monthStrip(x)}
      ${x.why?`<div class="fact">💡 ${esc(x.why)}</div>`:""}
      ${x.act?`<div class="meta"><b>실행</b> ${esc(x.act)}</div>`:""}
      ${(x.kws||[]).length?`<div class="meta">키워드 ${x.kws.map(esc).join(" · ")}</div>`:""}
    </div>`).join("")).join("");
  w.innerHTML=tabBar()+`
    <div class="banner">📅 <b>연간 시즌 이슈 캘린더</b> · 상품별 성수기·날씨 시즌. <b>날씨 시즌은 정확 일자(🗓️)</b>로 표기 — 월 전체가 아닙니다. 엔진 추천과 <b>같은 소스</b>(<code>data/seasonal.json</code>). 기준 ${esc(DATA.asof)} · 이번 달 ${cur}월.</div>
    <div class="sec-lbl">이번 달(${cur}월) 진행 <b>(${now.length})</b></div>
    ${now.length?now.map(({pk,w})=>`<div class="uc"><div class="t">${esc(pname(pk))} · ${esc(w.tag)}</div><div class="m">${w.span?"🗓️ "+esc(spanText(w)):esc(mrange(w.m))}</div></div>`).join(""):`<div class="empty">이번 달 활성 시즌 없음</div>`}
    ${blocks}
    <div class="foot">데이터: <code>data/seasonal.json</code> (엔진·캘린더 공유 단일 소스) · <a href="seasonal-tool.html">연간 상세·검색량 추세 →</a> · <a href="index.html">← 통합 콘솔</a></div>`;
}

function withinWindow(r){
  if(F.win==="all")return true;
  const days=+F.win, today=new Date(DATA.asof+"T00:00:00"), lim=new Date(today); lim.setDate(lim.getDate()+days);
  const vf=new Date(r.valid_from+"T00:00:00"), vt=new Date(r.valid_to+"T00:00:00");
  return vf<=lim && vt>=today;               // 유효기간이 [오늘, 오늘+N] 과 겹침
}
function match(r){
  return withinWindow(r)
    && (F.state==="all" || STGROUP[r.event_state]===F.state)
    && (F.product==="all" || r.product===F.product)
    && (F.event==="all" || r.event_id===F.event);
}
function renderReco(){
  const w=$("#wrap");
  if(!DATA.recommendations.length && !DATA.events.length){
    const fm=location.protocol==="file:";
    w.innerHTML=tabBar()+`<div class="banner">${fm?`⚠️ <b>로컬 파일로 열림.</b> 추천 데이터(<code>data/events/recommendations.json</code>)가 로드되지 않습니다. 배포 주소로 여세요 → <a href="https://imsplendid8.github.io/CM-CMO/event-calendar.html">여기</a>.`:`아직 생성된 추천이 없습니다. <code>python3 scripts/event_engine.py</code> 실행 후 갱신됩니다.`}</div>`;
    return;
  }
  const recs=DATA.recommendations.filter(match);
  const c=DATA.counts||{};
  const kpi=(n,l)=>`<div class="kpi"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`;
  const chip=(g,k,label)=>`<button class="chip${F[g]===k?" on":""}" data-f="${g}" data-v="${esc(k)}">${esc(label)}</button>`;
  const prods=[...new Map(DATA.recommendations.map(r=>[r.product,r.product_name])).entries()];
  const evs=[...new Map(DATA.recommendations.map(r=>[r.event_id,r.event_name])).entries()];
  const cards=recs.length?recs.map(r=>`
    <div class="card">
      <div class="card-h"><span class="st ${esc(r.event_state)}">${esc(STGROUP[r.event_state]||r.event_state)} · ${esc(r.event_state)}</span>
        <span class="prod">${esc(r.product_name)}</span><span class="ev">${esc(r.event_name)} · ${esc(r.event_type)}</span>
        ${r.transition?`<span class="tr-chip" title="상태 전이 · ${esc(r.transition.kind)}">🔄 ${esc(r.transition.from)}→${esc(r.transition.to)}</span>`:""}
        <span class="conf">conf ${r.confidence}</span></div>
      <div class="tline"><span class="k">제목</span><span class="v">${esc(r.title)}</span><button class="cp" data-copy="${esc(r.title)}">복사</button></div>
      <div class="tline"><span class="k">설명</span><span class="v">${esc(r.description)}</span><button class="cp" data-copy="${esc(r.description)}">복사</button></div>
      <div class="tline"><span class="k">소제목</span><span class="v">${esc(r.content_subhead)}</span><button class="cp" data-copy="${esc(r.content_subhead)}">복사</button></div>
      <div class="fact">📌 ${r.fact.map(esc).join(" · ")}</div>
      <div class="meta"><b>이유</b> ${esc(r.reason)} · <b>데이터</b> ${r.data_used.map(esc).join(", ")}<br>
        <b>유효</b> ${esc(r.valid_from)} ~ ${esc(r.valid_to)} · <b>채널</b> ${r.channels.map(esc).join(", ")} · <b>상품근거</b> ${esc(r.product_basis)}<br>
        <span class="rev">${esc(r.review_status)}</span> · <span class="avoid">피할 표현: ${r.avoid_phrases.slice(0,5).map(esc).join(", ")}…</span> · <span style="font-family:var(--mono);color:var(--muted)">fp ${esc(r.fingerprint)}</span></div>
    </div>`).join(""):`<div class="empty">필터에 맞는 추천이 없습니다.</div>`;
  const uc=DATA.unclassified||[];
  w.innerHTML=tabBar()+`
    <div class="banner"><b>규칙 기반 추천 · 사람 검토 전</b> — 모든 문구는 <b>상품 근거 미확인 · 심의 검토 전 · 운영 후보</b>입니다. 공포·압박·담보 단정 문구는 생성하지 않으며, 분류 불확실 뉴스는 아래 <b>검토 큐</b>로 보냅니다. 기준 ${esc(DATA.asof)}.</div>
    <div class="kpis">${kpi(c.events||0,"이벤트")}${kpi(c.recommendations||0,"추천(운영 후보)")}${kpi(c.transitions||0,"상태 전이")}${kpi(c.suppressed_cooldown||0,"cooldown 억제")}${kpi(c.unclassified||0,"미분류 검토 큐")}</div>
    <div class="filters">
      <div class="fgroup"><span class="lb">기간</span>${chip("win","0","오늘")}${chip("win","7","7일")}${chip("win","30","30일")}${chip("win","all","전체")}</div>
      <div class="fgroup"><span class="lb">상태</span>${chip("state","all","전체")}${chip("state","예정","예정")}${chip("state","진행","진행")}${chip("state","종료","종료")}${chip("state","후속","후속")}</div>
      <div class="fgroup"><span class="lb">상품</span><select id="fprod"><option value="all">전체</option>${prods.map(([k,n])=>`<option value="${esc(k)}"${F.product===k?" selected":""}>${esc(n)}</option>`).join("")}</select></div>
      <div class="fgroup"><span class="lb">이벤트</span><select id="fev"><option value="all">전체</option>${evs.map(([k,n])=>`<option value="${esc(k)}"${F.event===k?" selected":""}>${esc(n)}</option>`).join("")}</select></div>
    </div>
    ${(DATA.transitions&&DATA.transitions.length)?`<div class="sec-lbl">🔄 상태 전이 <b>(${DATA.transitions.length})</b> · 최근 스냅샷 대비 — 상태가 바뀌면 목적·유효기간도 변경</div>`+DATA.transitions.map(t=>`<div class="uc"><div class="t">${esc(t.event_id)}</div><div class="m">${esc(t.from)} → ${esc(t.to)} · ${esc(t.kind)}${t.from_kind?` · 이전: ${esc(t.from_kind)}`:""}</div></div>`).join(""):""}
    <div class="sec-lbl">추천 문구 <b>(${recs.length})</b> · 운영 후보(사람 검토 필요)</div>
    ${cards}
    <div class="sec-lbl">🔎 미분류 검토 큐 <b>(${uc.length})</b> · 자동 문구 생성 안 함 — 사람이 분류</div>
    ${uc.slice(0,40).map(u=>`<div class="uc"><div class="t">${esc(u.title)}</div><div class="m">${esc(u.src)} · ${esc(u.date)} · ${esc(u.reason)}</div></div>`).join("")||'<div class="empty">미분류 없음</div>'}
    <div class="foot">데이터: <code>data/events/recommendations.json</code> ← <code>scripts/event_engine.py</code>(규칙 기반) · 이벤트 소스: 캘린더·시즌·기상신호·뉴스 클리핑·검색량 · <a href="index.html">← 통합 콘솔</a></div>`;
}
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]"); if(tb){TAB=tb.dataset.tab;render();return;}
  const f=e.target.closest("[data-f]"); if(f){F[f.dataset.f]=f.dataset.v;render();return;}
  const cp=e.target.closest("[data-copy]"); if(cp){const t=cp.dataset.copy;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("복사됨")).catch(()=>{
      const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("복사됨");}catch(_){}ta.remove();});}
});
document.addEventListener("change",e=>{
  if(e.target.id==="fprod"){F.product=e.target.value;render();}
  if(e.target.id==="fev"){F.event=e.target.value;render();}
});
$("#themeBtn").addEventListener("click",()=>{const c=document.documentElement.getAttribute("data-theme");const d=c?c==="dark":matchMedia("(prefers-color-scheme:dark)").matches;document.documentElement.setAttribute("data-theme",d?"light":"dark");try{localStorage.setItem("mf_theme",d?"light":"dark")}catch(_){};});
// 상품명 매핑(시즌 탭 라벨용) — 엔진·캘린더 공유 마스터
fetch("data/products.json").then(r=>r.json()).then(p=>{(p.products||[]).forEach(x=>{PRODNAMES[x.key]=x.name;});}).catch(()=>{});
if(location.hash==="#season")TAB="season";
fetch("data/events/recommendations.json").then(r=>r.json()).then(d=>{DATA=d;render();}).catch(()=>render());
render();
</script>
</body>
</html>
