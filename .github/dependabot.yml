# 커밋 SHA로 고정한 GitHub Actions와 npm(Playwright) 의존성을 주 1회 점검해 PR로 올린다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
