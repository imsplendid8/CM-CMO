name: Monthly Keyword Discovery

# 매월 1일 09:45 KST: 네이버 공개 검색 화면에 보이는 자동완성 롱테일을 새로 수집한다.
# 로그인·비공개 API·사내망을 사용하지 않으며, 최근 13개월 스냅샷으로 신규 여부를 계산한다.
on:
  schedule:
    - cron: "45 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cm-cmo-data-writers
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install Playwright + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Collect visible Naver autocomplete keywords
        run: node scripts/capture_naver_autocomplete.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/keyword-autocomplete.json
          if git diff --staged --quiet; then echo "변경 없음"; else
            git commit -m "chore(keyword): 월간 네이버 자동완성 갱신"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push 재시도 $i (main 갱신 감지)"; sleep $((i*5))
              [ "$i" = 3 ] && { echo "::error::main push 실패 — 재시도 소진, 수동 확인 필요"; exit 1; }
            done
          fi
