name: Technical SEO Audit (unlighthouse)

# 담당 URL의 테크니컬 SEO를 정기/수동으로 실측 → 리포트 아티팩트로 저장
on:
  workflow_dispatch:          # 수동 실행
  schedule:
    - cron: '0 0 1 * *'       # 매월 1일 00:00 UTC

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # harlan-zw/unlighthouse — 담당 라우트만 크롤(설정파일 사용)
      - name: Run unlighthouse (technical SEO)
        run: npx unlighthouse-ci --config-file unlighthouse.config.ts --build-static
        continue-on-error: true

      # 리포트를 아티팩트로 저장 (다운로드해서 열람, 또는 Pages로 배포 가능)
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unlighthouse-report
          path: .unlighthouse
