name: Daily Brief (Email)

# 데일리 비서 브리핑을 이메일로 매일 08:30 KST 발송 (텔레그램과 별도).
# 필요 Secrets:
#   SMTP_USER  (필수) 발송 계정 (예: Gmail 주소)
#   SMTP_PASS  (필수) 앱 비밀번호 (Gmail=2단계인증 후 '앱 비밀번호' 16자리)
#   EMAIL_TO   (필수) 수신 메일 (콤마로 여러 명)
#   선택: SMTP_HOST(기본 smtp.gmail.com) · SMTP_PORT(기본 587·STARTTLS, 465=SSL) · EMAIL_FROM(기본 SMTP_USER)
# 설정법: docs/daily-brief.md

run-name: ${{ inputs.source == 'scheduler' && format('Daily Brief (Email) · 정시 {0}', inputs.slot) || 'Daily Brief (Email)' }}

on:
  schedule:
    - cron: "30 23 * * *"   # 08:30 KST (UTC 23:30 전일) — news 07:30·signals 06:00 수집 뒤
  workflow_dispatch:
    inputs:
      source:
        description: "호출 주체 — scheduler = Cloudflare Worker 정시 호출(proxy/naver-proxy-worker.js)"
        required: false
        default: "manual"
      slot:
        description: "발송 회차(am/pm)"
        required: false
        default: ""

# 브리프는 커밋/푸시하지 않고 이메일만 발송 → 최소 권한(read).
permissions:
  contents: read
  actions: read   # 정시 호출 실행 여부 조회(중복 발송 방지)

# 읽기 전용 이메일은 커밋 워크플로와 분리한다. 수집 지연이 발송 시작을 막지 않으며,
# 본문 하단의 자동화 상태가 실제 원천 파일 신선도를 보여준다.
concurrency:
  group: cm-cmo-brief-email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record trigger timing
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule || 'workflow_dispatch' }}
        run: |
          now_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          now_kst=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')
          {
            echo "## 이메일 발송 타이밍"
            echo "- 예약 표현: ${SCHEDULE_EXPR}"
            echo "- 실제 시작(UTC): ${now_utc}"
            echo "- 실제 시작(KST): ${now_kst}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Skip if the on-time scheduler already sent
        id: guard
        # GitHub cron은 수 시간 늦게 시작될 수 있다. Cloudflare 정시 호출이 이미 성공했으면
        # 늦게 시작된 예약 실행은 발송하지 않는다(정시 호출이 없으면 기존처럼 이 실행이 발송).
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: daily-email.yml
        run: |
          since=$(date -u -d '-20 hours' '+%Y-%m-%dT%H:%M:%SZ')
          n=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?event=workflow_dispatch&status=success&created=%3E%3D${since}&per_page=30" \
            | python3 -c "import json,sys; print(sum(1 for r in json.load(sys.stdin).get('workflow_runs', []) if '정시' in (r.get('display_title') or '')))" \
            || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "- 최근 20시간 안에 정시 호출 발송 성공 ${n}건 → 늦게 시작된 예약 실행은 건너뜀" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Send daily brief (email)
        if: steps.guard.outputs.skip != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}     # 선택(기본 smtp.gmail.com)
          SMTP_PORT: ${{ secrets.SMTP_PORT }}     # 선택(기본 587)
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}   # 선택(기본 SMTP_USER)
        run: python3 scripts/daily_brief.py --email
