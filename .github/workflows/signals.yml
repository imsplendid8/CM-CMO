name: Demand Signals

# 공공데이터(기상특보·여행수요·출입국관광통계)로 상품별 실시간 수요 신호 → data/signals.json
on:
  schedule:
    - cron: "30 21 * * *"   # 매일 06:30 KST (UTC 21:30)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cm-cmo-data-writers   # 커밋 워크플로 공유 레인 → main 동시 push 직렬화(P0-2)
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fetch demand signals
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TOUR_API_URL: ${{ secrets.TOUR_API_URL }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          TOUR_API_FORMAT: ${{ secrets.TOUR_API_FORMAT }}
          TOUR_API_START_DT: ${{ secrets.TOUR_API_START_DT }}
          TOUR_API_END_DT: ${{ secrets.TOUR_API_END_DT }}
          TOUR_API_PAGE_NO: ${{ secrets.TOUR_API_PAGE_NO }}
          TOUR_API_NUM_OF_ROWS: ${{ secrets.TOUR_API_NUM_OF_ROWS }}
        run: python3 scripts/fetch_signals.py
      - name: Commit signals
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(signals): 수요 신호 갱신 $(date +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push 재시도 $i (main 갱신 감지)"; sleep $((i*5))
              [ "$i" = 3 ] && { echo "::error::main push 실패 — 재시도 소진, 수동 확인 필요"; exit 1; }
            done
          fi
