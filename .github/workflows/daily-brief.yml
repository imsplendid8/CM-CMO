name: Daily Brief (Telegram)

# 데일리 비서 브리핑을 텔레그램으로 하루 2회(오전 08:00 · 오후 14:00 KST) 발송.
# 필요 Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_IDS(다중 수신자·콤마 구분) 또는 TELEGRAM_CHAT_ID(단일)
#              (선택: NAVER_CLIENT_ID, NAVER_CLIENT_SECRET)
# 수신자는 GitHub Actions Secrets, 발송시간은 이 워크플로의 UTC cron에서만 관리한다.
# 설정법: docs/daily-brief.md

on:
  schedule:
    - cron: "0 23 * * *"    # 08:00 KST (오전) — news/자동화 수집 후 발송
    - cron: "0 5 * * *"    # 14:00 KST (오후) — news 13:20·자동화상태 13:40 뒤
  workflow_dispatch:

# 브리프는 커밋/푸시하지 않고 텔레그램만 발송 → 최소 권한(read).
permissions:
  contents: read

# 읽기 전용 알림은 커밋 워크플로와 분리한다. 수집 지연이 알림 시작을 막지 않으며,
# 브리프 본문에는 원천 파일의 실제 신선도를 표시한다.
concurrency:
  group: cm-cmo-brief-telegram
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record trigger timing
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule || 'workflow_dispatch' }}
        run: |
          now_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          now_kst=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')
          {
            echo "## 텔레그램 발송 타이밍"
            echo "- 예약 표현: ${SCHEDULE_EXPR}"
            echo "- 실제 시작(UTC): ${now_utc}"
            echo "- 실제 시작(KST): ${now_kst}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Send daily brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}   # 다중 수신자(콤마 구분) · 우선
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}     # 단일(하위호환 폴백)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python3 scripts/daily_brief.py
