name: CI

# push/PR 시 품질 점검: 상품 마스터 드리프트 + 전체 HTML/공유 JS 문법.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 정적 분석 — Python(ruff) · 워크플로 문법(actionlint+shellcheck) · 워크플로 보안(zizmor, 존재하지 않는 액션 SHA까지 온라인 검사)
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Python 정적 분석(ruff)
        run: |
          python3 -m pip install --quiet ruff==0.15.8
          ruff check scripts tests
      - name: 워크플로 문법 검사(actionlint)
        run: |
          curl -sSfL -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color
      - name: 워크플로 보안 검사(zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet zizmor==1.30.1
          zizmor --config .github/zizmor.yml --min-severity medium .github/workflows

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: 상품 마스터 동기화 검사
        run: python3 scripts/check_products_sync.py
      - name: SEO 제목 검토 큐 검사
        run: python3 scripts/seo_title_agent.py --validate
      - name: 테스트 의존성(PyYAML — 워크플로 정적 테스트용)
        run: python3 -m pip install --quiet pyyaml==6.0.2
      - name: 파이썬 단위 테스트
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: 랜딩·SERP 자료 컨텍스트 연결 검사
        run: python3 scripts/check_material_source_context.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: 도구 JS 문법 검사
        run: |
          node -e '
            const fs=require("fs");
            const files=fs.readdirSync(".").filter(f=>f.endsWith(".html")).sort();
            let bad=0;
            for(const f of files){
              const html=fs.readFileSync(f,"utf8");
              const blocks=[...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
              const js=blocks.map(m=>m[1]).join("\n");
              try{new Function(js);console.log("OK  "+f);}catch(e){console.error("SYNTAX ERROR "+f+": "+e.message);bad++;}
            }
            process.exit(bad?1:0);
          '
      - name: 공유 JS 문법 검사
        run: |
          node --check shared/mobile-sidebar.js
          node --check shared/feedback-client.js
          node --check shared/humanize-ko.js
          node --check shared/insurance-ad-review.js
          node --check shared/naver-material-specs.js
          node --check shared/planning-context.js
          node --check shared/ui-icons.js
          node --check shared/zip-store.js
      - name: 검색광고 소재 12상품 × 50행 검증
        run: node scripts/check_adcopy_export.mjs
      - name: SERP 이미지 소재 연결 검증
        run: node scripts/check_adcopy_images.mjs
      - name: 이미지 생성 대기열 계약 검증
        run: python3 scripts/image_generation_queue.py --validate
      - name: 보험광고 법령 기반 사전검수 검증
        run: node scripts/check_insurance_ad_review.mjs
      - name: 파워컨텐츠 12상품 소재 품질 검증
        run: node scripts/check_powercontent.mjs
      - name: 파워컨텐츠 원고 재료 검증(안내형 표현·보장 사실·사전검수)
        run: node scripts/check_power_content_articles.mjs
      - name: (특약) 규칙 구현 일치
        run: node scripts/check_rider_parity.mjs
      - name: 월간 신규·급상승 키워드 판정 검증
        run: node scripts/check_keyword_monthly.mjs
      - name: 월간 네이버 자동완성 신규·등록 판정 검증
        run: |
          node --check scripts/capture_naver_autocomplete.mjs
          node --check scripts/keyword_autocomplete_core.mjs
          node scripts/check_keyword_autocomplete.mjs
      - name: Cloudflare 정시 스케줄러 계약 검증
        run: node scripts/check_worker_scheduler.mjs
      - name: SERP 파워링크 추출기 문법 검사
        run: node --check scripts/serp_powerlink_extract.mjs && node --check scripts/capture_serp.mjs && node --check scripts/check_serp_powerlink.mjs
