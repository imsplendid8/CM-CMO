name: Generate Image Assets

# 유료 이미지 API 호출은 두 경로로만 실행한다.
#  ① 수동: Run workflow에서 execute=true + limit/product 지정
#  ② 월간 자동: 매월 1일 11:00 KST(월간 썸네일 계획 09:30 뒤). 저장소 변수 IMAGE_AUTOGEN_LIMIT(1~20)을
#     설정했을 때만 그 수만큼 생성 — 변수가 없거나 0이면 미리보기만 하고 API를 부르지 않는다(기본 꺼짐).
on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      execute:
        description: "실제 이미지 API 호출(비용 발생)을 허용"
        required: true
        type: boolean
        default: false
      limit:
        description: "이번 실행에서 만들 최대 이미지 수"
        required: true
        default: "4"
        type: string
      product:
        description: "상품 키(비우면 전체 pending, 예: driver)"
        required: false
        default: ""
        type: string
      retry_failed:
        description: "이전 실패 항목도 재시도"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cm-cmo-data-writers
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      # 수동 실행은 입력값, 월간 자동은 저장소 변수(없으면 0=꺼짐)
      RUN_EXECUTE: ${{ github.event_name == 'workflow_dispatch' && inputs.execute == true || github.event_name == 'schedule' && vars.IMAGE_AUTOGEN_LIMIT != '' && vars.IMAGE_AUTOGEN_LIMIT != '0' }}
      LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || vars.IMAGE_AUTOGEN_LIMIT || '0' }}
      PRODUCT: ${{ github.event_name == 'workflow_dispatch' && inputs.product || '' }}
      RETRY_FAILED: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_failed || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Preview image queue
        run: |
          # 미리보기는 비용이 없다 — 자동 생성이 꺼져 있으면(0) 다음 대기 4건만 보여 준다
          [ "${LIMIT:-0}" -ge 1 ] 2>/dev/null || LIMIT=4
          args=(--limit "$LIMIT")
          if [ -n "$PRODUCT" ]; then args+=(--product "$PRODUCT"); fi
          if [ "$RETRY_FAILED" = "true" ]; then args+=(--retry-failed); fi
          python3 scripts/generate_image_assets.py "${args[@]}"
      - name: Generate PNGs (explicit opt-in only)
        id: generate
        continue-on-error: true
        if: ${{ env.RUN_EXECUTE == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_API_URL: ${{ vars.OPENAI_IMAGE_API_URL }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY }}
        run: |
          args=(--execute --limit "$LIMIT")
          if [ -n "$PRODUCT" ]; then args+=(--product "$PRODUCT"); fi
          if [ "$RETRY_FAILED" = "true" ]; then args+=(--retry-failed); fi
          python3 scripts/generate_image_assets.py "${args[@]}"
      - name: Validate generated assets
        id: validate
        if: ${{ always() && env.RUN_EXECUTE == 'true' }}
        run: |
          python3 scripts/image_generation_queue.py --validate
          node scripts/check_adcopy_images.mjs
      - name: Commit generated PNGs
        if: ${{ always() && env.RUN_EXECUTE == 'true' && steps.validate.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/insurance/generated data/adcopy/serp-candidates.json data/adcopy/image-generation-queue.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(images): generate approved thumbnail assets"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
              sleep $((attempt * 5))
            done
            exit 1
          fi
      - name: Report generation warnings
        if: ${{ always() && env.RUN_EXECUTE == 'true' && steps.generate.outcome == 'failure' }}
        run: |
          echo "::warning::일부 이미지 생성에 실패했습니다. 실패 항목과 오류 요약을 큐에 기록했습니다. retry_failed=true로 재시도하세요."
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## 이미지 생성 경고"
              echo "일부 항목이 실패했습니다. 큐의 \`failed\` 상태를 확인하고 \`retry_failed=true\`로 재시도하세요."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
