name: Deploy Cloudflare Worker

# proxy/ 가 main에 바뀌면 워커를 자동 배포한다(Cloudflare 편집기 복사·붙여넣기 불필요).
# wrangler.toml의 Cron(*/5)도 함께 적용된다. 대시보드에서 만든 KV 바인딩은 이름으로 찾아 그대로 이어 붙이고,
# 워커 Secret(NAVER_ID·GH_DISPATCH_TOKEN 등)은 wrangler가 건드리지 않는다.
# 필요 GitHub Secrets: CLOUDFLARE_API_TOKEN(템플릿 'Edit Cloudflare Workers'), CLOUDFLARE_ACCOUNT_ID
# 둘 중 하나라도 없으면 배포를 건너뛴다(실패 아님).
on:
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - ".github/workflows/worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cm-cmo-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID 미설정 — 워커 자동 배포를 건너뜀(docs/운영-설정-체크리스트.md)"
            exit 0
          fi
          # 붙여넣기 실수(두 줄·공백 포함)를 값 노출 없이 알려 준다
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            value=$(printenv "$name" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            case "$value" in
              *[[:space:]]*) echo "::error::$name 값 중간에 줄바꿈·공백이 있음 — 다른 값까지 함께 붙여 넣은 것으로 보임. GitHub Secret을 Update로 열어 해당 값 한 줄만 다시 넣으세요."; exit 1;;
            esac
          done
          id=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          if ! printf %s "$id" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID는 영문 소문자·숫자 32자리여야 함(현재 ${#id}자) — Workers & Pages 화면의 Account ID를 다시 복사하세요."; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.skip != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.creds.outputs.skip != 'true'
        with:
          node-version: "22"
      - name: Attach existing KV bindings
        if: steps.creds.outputs.skip != 'true'
        working-directory: proxy
        run: python3 ../scripts/worker_bindings.py wrangler.toml
      - name: Syntax check
        if: steps.creds.outputs.skip != 'true'
        run: node scripts/check_worker_scheduler.mjs
      - name: Deploy
        if: steps.creds.outputs.skip != 'true'
        working-directory: proxy
        run: |
          # 앞뒤 줄바꿈 제거(중간 공백은 위 검사에서 이미 막음)
          CLOUDFLARE_API_TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          CLOUDFLARE_ACCOUNT_ID=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx -y wrangler@4 deploy
      - name: Verify /health
        if: steps.creds.outputs.skip != 'true'
        run: |
          sleep 10
          curl -fsS https://modooflow-naver-proxy.angle0102.workers.dev/health | tee /tmp/health.json
          python3 -c "import json;h=json.load(open('/tmp/health.json'));assert 'missing' in h,'새 코드가 아님';print('빠진 설정:',h['missing'] or '없음')"
