name: Event Recommendations

# 뉴스·시즌 이벤트 캘린더 추천 재생성 → data/events/recommendations.json + state_history.json
# 규칙 기반·결정론(scripts/event_engine.py). 수집(signals·news-clip) 뒤, 데일리 브리프 전에 실행.
on:
  schedule:
    - cron: "45 22 * * *"   # 07:45 KST (UTC 22:45) — signals 06:00·news 07:30 뒤, 오전 브리프 08:00 전
    - cron: "45 4 * * *"    # 13:45 KST (UTC 04:45) — news 13:00 뒤, 오후 브리프 14:00 전
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cm-cmo-data-writers   # 커밋 워크플로 공유 레인 → main 동시 push 직렬화(P0-2)
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate event recommendations
        run: python3 scripts/event_engine.py    # 표준 라이브러리만 · 커밋된 데이터로 결정론 생성
      - name: Commit recommendations
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events/recommendations.json data/events/state_history.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(event): 추천 재생성 $(date +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push 재시도 $i (main 갱신 감지)"; sleep $((i*5))
              [ "$i" = 3 ] && { echo "::error::main push 실패 — 재시도 소진, 수동 확인 필요"; exit 1; }
            done
          fi
