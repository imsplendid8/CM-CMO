name: Deploy to GitHub Pages

# main에 push되면 정적 사이트(허브 + 각 도구)를 GitHub Pages로 배포합니다.
# 최초 1회: 저장소 Settings → Pages → Build and deployment → Source = "GitHub Actions" 로 설정하세요.

on:
  push:
    branches: [main]
  # 봇 데이터 커밋(github-actions[bot], GITHUB_TOKEN)은 push 이벤트를 트리거하지 못하므로
  # (GitHub의 재귀 방지), 커밋 워크플로 완료 시 workflow_run 으로 재배포해 사이트 신선도를 유지한다.
  workflow_run:
    workflows:
      - "Demand Signals"
      - "News Clip"
      - "Event Recommendations"
      - "Naver SearchAd Volume"
      - "SERP Capture"
      - "Naver Trends (DataLab)"
      - "Content Intelligence Agents"
      - "Monthly Image Thumbnail Plan"
      - "Monthly Keyword Discovery"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1건만 유지 (진행 중 실행은 취소하지 않고 큐잉)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run 트리거일 때는 커밋 워크플로가 성공한 경우에만 배포(실패 실행으로 재배포 방지).
    # push·수동 dispatch 는 항상 배포.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build public site
        run: python3 scripts/build_pages.py
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
