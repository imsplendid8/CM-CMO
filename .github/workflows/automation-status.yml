name: Automation Health

# 자동화 수집 상태 점검 — 각 산출물(뉴스·신호·검색량·트렌드·SERP)의 실제 최신성을
# 매번 다시 계산해 Actions 로그·Run 요약에 표시(브리프 직전 체크포인트).
# check_automation_health 는 '저장 요약'을 신뢰하지 않는 설계 → 파일 커밋 없음(최소 권한 read).
# 매일 07:40 · 13:40 KST — 뉴스 수집(07:20/13:20) 뒤, 브리프(08:00/14:00) 전.

on:
  schedule:
    - cron: "40 22 * * *"   # 07:40 KST (UTC 22:40 전일) — 오전 수집 뒤, 오전 브리프 전
    - cron: "40 4 * * *"    # 13:40 KST (UTC 04:40) — 오후 수집 뒤, 오후 브리프 전
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cm-cmo-automation-status  # 읽기 전용 점검은 커밋 워크플로와 분리해 시작 지연 방지
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 자동화 상태 점검
        run: |
          echo "## 🔭 자동화 수집 상태 ($(TZ=Asia/Seoul date '+%F %H:%M') KST)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/check_automation_health.py --json | tee automation-health.json >/dev/null
          python3 scripts/check_automation_health.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: 실패 이력 GitHub Issue 생성
        if: always()
        uses: actions/github-script@60a0d83039c74a4e8d3c7e3b5ba8f0c9f2c6e4a6 # v7
        with:
          script: |
            const fs = require('fs');
            const path = 'automation-health.json';
            if (!fs.existsSync(path)) return;
            const health = JSON.parse(fs.readFileSync(path, 'utf8'));
            const failed = (health.items || []).filter(item => item.state && item.state !== 'healthy');
            if (!failed.length) return;
            const title = `자동화 실패 이력 · ${health.asof}`;
            const body = [
              `자동화 상태 점검에서 실패 항목이 감지되었습니다.`,
              ``,
              `- 기준 시각: ${health.asof} KST`,
              `- 요약: healthy ${health.summary?.healthy ?? 0}, stale ${health.summary?.stale ?? 0}, missing ${health.summary?.missing ?? 0}, unknown ${health.summary?.unknown ?? 0}`,
              ``,
              `## 실패 항목`,
              ...failed.map(item => `- ${item.name}: ${item.state}${item.date ? ` (${item.date})` : ""}`),
              ``,
              `## 워크플로`,
              `- run_id: ${context.runId}`,
              `- run_attempt: ${context.runAttempt}`,
              `- workflow: ${context.workflow}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['automation', 'failure', 'dashboard-summary']
            });
