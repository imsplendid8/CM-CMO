name: Content Intelligence Agents

on:
  schedule:
    - cron: "10 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cm-cmo-data-writers
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 상품 근거 원장 검증
        run: python scripts/claim_evidence.py validate
      - name: SERP 분석과 검색광고 후보 생성
        run: |
          python scripts/serp_analysis.py
          python scripts/serp_copy_agent.py
      - name: Search Console 검색어 수집 (Secret 설정 시)
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python scripts/fetch_search_console.py
      - name: FAQ 검색 기회 생성
        run: python scripts/faq_opportunity_agent.py
      - name: 회귀 테스트
        run: python -m unittest tests.test_content_agents -v
      - name: 산출물 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serp/ad_analysis.json data/adcopy/serp-candidates.json data/seo/faq-opportunities.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(content): SERP 소재·FAQ 기회 갱신 $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
