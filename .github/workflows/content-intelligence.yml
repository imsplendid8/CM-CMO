name: Content Intelligence Agents

on:
  schedule:
    - cron: "10 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cm-cmo-data-writers
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 기존 파워콘텐츠 제안 이력 보존
        run: python scripts/powercontent_history.py
      - name: SERP 분석과 소재 입력 신호 생성
        run: |
          python scripts/serp_analysis.py
          python scripts/serp_copy_agent.py
      - name: Search Console 검색어 수집 (Secret 설정 시)
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python scripts/fetch_search_console.py
      - name: SEO 인텔 병합
        run: python scripts/build_seo_intel.py
      - name: FAQ 검색 기회 생성
        run: python scripts/faq_opportunity_agent.py
      - name: SEO 근거 기반 파워컨텐츠 제목 검토 큐 생성
        run: python scripts/seo_title_agent.py
      - name: 회귀 테스트
        run: python -m unittest tests.test_content_agents tests.test_seo_title_ops -v
      - name: 첨부 소재생성가이드 적용 검사
        run: python scripts/check_material_generation_guide.py
      - name: 랜딩·SERP 자료 컨텍스트 연결 검사
        run: python scripts/check_material_source_context.py
      - name: 산출물 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serp/ad_analysis.json data/adcopy/serp-candidates.json data/adcopy/powercontent-title-opportunities.json data/adcopy/powercontent-history.json data/seo/site-observations.json data/seo/faq-opportunities.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(content): SERP 소재 입력·FAQ 기회 갱신 $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
