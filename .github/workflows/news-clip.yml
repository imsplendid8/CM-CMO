name: News Clip

# 카테고리별 뉴스 클리핑 하루 2회(07:30·13시 KST) → data/clips/ 적립
# 오전은 오전 브리프(08:00 KST)보다 먼저 수집되도록 07:30 KST에 실행(P0-2 실행순서).
on:
  schedule:
    - cron: "20 22 * * *"  # 07:20 KST (UTC 22:20) — 자동화상태(07:40)·오전 브리프(08:00) 전 수집
    - cron: "20 4 * * *"   # 13:20 KST (UTC 04:20) — 자동화상태(13:40)·오후 브리프(14:00) 전 수집
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cm-cmo-data-writers   # 커밋 워크플로 공유 레인 → main 동시 push 직렬화(P0-2)
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clip news
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python3 scripts/clip_news.py
      - name: Commit clips
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/clips/ data/briefing/   # 클리핑 + 채널 공통 요약 + 보관 초과분 삭제
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "chore(clips): 뉴스 클리핑 $(TZ=Asia/Seoul date '+%F %H:%M')"
            # 안전 push: main 갱신 시 rebase 후 재시도(클리핑·파생 브리프만 건드려 겹침 없음)
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push 재시도 $i (main 갱신 감지)"; sleep $((i*5))
              [ "$i" = 3 ] && { echo "::error::main push 실패 — 재시도 소진, 수동 확인 필요"; exit 1; }
            done
          fi
