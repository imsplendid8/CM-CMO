name: Naver SearchAd Volume

# 매주 월 05:00 KST(=일 20:00 UTC) 네이버 검색광고 키워드도구로 실검색량 갱신
# → data/volume.json(현재) + data/volume-history.json(월별 최근 13개월).
# 필요 Secrets(검색/데이터랩 키와 '다름'): NAVER_AD_API_KEY, NAVER_AD_SECRET, NAVER_AD_CUSTOMER
#   발급: searchad.naver.com → 도구 → API 사용 관리. 없거나 일부 실패하면 기존 정상본 유지 후 워크플로 실패.
# 수동 실행: Actions → Naver SearchAd Volume → Run workflow

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cm-cmo-data-writers   # 커밋 워크플로 공유 레인 → main 동시 push 직렬화(P0-2)
  cancel-in-progress: false

jobs:
  volume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fetch search volume
        env:
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER: ${{ secrets.NAVER_AD_CUSTOMER }}
        run: python3 scripts/naver_searchad_volume.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/volume.json data/volume-history.json
          if git diff --staged --quiet; then echo "변경 없음"; else
            git commit -m "chore: 검색광고 실검색량·월별 이력 갱신"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push 재시도 $i (main 갱신 감지)"; sleep $((i*5))
              [ "$i" = 3 ] && { echo "::error::main push 실패 — 재시도 소진, 수동 확인 필요"; exit 1; }
            done
          fi
