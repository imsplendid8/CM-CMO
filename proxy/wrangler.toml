name = "modooflow-naver-proxy"
main = "naver-proxy-worker.js"
compatibility_date = "2024-11-01"

# API 남용 방지와 사용량 카운트를 위해 KV 네임스페이스를 'USAGE' 로 반드시 바인딩:
#   대시보드: Workers & Pages → 워커 → Settings → Bindings → Add → KV namespace
#            Variable name = USAGE, 새 네임스페이스(예: modooflow-usage) 생성 후 연결 → Deploy
#   CLI:     wrangler kv namespace create USAGE   → 출력된 id 를 아래에 붙여넣고 주석 해제
# USAGE가 없으면 /health 외 API는 503으로 실패하도록 설계되어 있습니다.
# [[kv_namespaces]]
# binding = "USAGE"
# id = "여기에_네임스페이스_id"

# 비공개 소재 검수 이벤트는 D1에만 저장한다. 아래 바인딩을 만든 뒤 주석을
# 해제하고 database_id를 실제 값으로 교체한다.
#   wrangler d1 create modooflow-feedback
#   wrangler d1 execute modooflow-feedback --remote --file ../docs/feedback-schema.sql
# [[d1_databases]]
# binding = "FEEDBACK_DB"
# database_name = "modooflow-feedback"
# database_id = "여기에_D1_database_id"

# 키를 워커에 직접 넣는 방식(B, 더 안전)을 쓰려면 아래를 wrangler secret 으로 등록:
#   wrangler secret put NAVER_ID
#   wrangler secret put NAVER_SECRET
#   wrangler secret put AD_KEY
#   wrangler secret put AD_SECRET
#   wrangler secret put AD_CUSTOMER
#   wrangler secret put ACTOR_HASH_SALT
# ACTOR_HASH_SALT는 32바이트 이상 무작위 값으로 생성하고 저장소에 커밋하지 않는다.
# /v1/feedback 경로는 Cloudflare Access 정책으로 보호해
# Cf-Access-Authenticated-User-Email과 Cf-Access-Jwt-Assertion을 함께 전달한다.
# (설정창 헤더 방식(A)만 쓸 거면 시크릿 등록 불필요)
