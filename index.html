<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.workers.dev http://localhost:8787; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Modoo — 한화손보 CM SEO·SEM 마케팅 콘솔 허브(전 기능 상단 고정)">
<title>Modoo · 한화손보 CM 마케팅 콘솔</title>
<style>
@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:url('fonts/PretendardVariable.woff2') format('woff2-variations');}
:root{
  --brand:#e0850f; --brand-600:#b96b08; --brand-50:#fdf3e7;
  --grad:linear-gradient(135deg,#f0940f 0%,#e0850f 100%);
  --ink:#0f1729; --ink-2:#4a5163; --muted:#8b93a3; --line:#e8ebef; --line-2:#eef1f4;
  --bg:#f7f8fa; --surface:#ffffff; --surface-2:#f4f6f8;
  --sh:0 1px 2px rgba(15,23,41,.04),0 2px 6px rgba(15,23,41,.05); --sh-lg:0 12px 30px rgba(15,23,41,.10);
  --sans:'Pretendard Variable','Pretendard','Noto Sans KR','Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace; --top:54px;
}
@media(prefers-color-scheme:dark){:root{--ink:#eef1f6;--ink-2:#b7bdc9;--muted:#7f8697;--line:#262b35;--line-2:#20242d;--bg:#0e1016;--surface:#171a21;--surface-2:#1d212a;--brand-50:#3a2a12;--sh:0 1px 2px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.5);--sh-lg:0 14px 34px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{--ink:#eef1f6;--ink-2:#b7bdc9;--muted:#7f8697;--line:#262b35;--line-2:#20242d;--bg:#0e1016;--surface:#171a21;--surface-2:#1d212a;--brand-50:#3a2a12;--sh:0 1px 2px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.5);--sh-lg:0 14px 34px rgba(0,0,0,.6);}
:root[data-theme="light"]{--ink:#0f1729;--ink-2:#4a5163;--muted:#8b93a3;--line:#e8ebef;--line-2:#eef1f4;--bg:#f7f8fa;--surface:#ffffff;--surface-2:#f4f6f8;--brand-50:#fdf3e7;--sh:0 1px 2px rgba(15,23,41,.04),0 2px 6px rgba(15,23,41,.05);--sh-lg:0 12px 30px rgba(15,23,41,.10);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.011em;word-break:keep-all;overflow:hidden;display:flex;flex-direction:column;}
/* 상단 내비 — 도구를 전부 펼치고, 한 줄에 안 들어오면 2줄로 wrap(헤더 높이 자동↑, 본문은 남은 높이 채움) */
.top{position:sticky;top:0;z-index:30;flex:0 0 auto;display:flex;align-items:center;gap:8px 14px;padding:7px 16px;min-height:var(--top);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);}
.logo{display:flex;align-items:center;gap:9px;flex:0 0 auto;text-decoration:none;color:inherit;}
.logo .m{width:30px;height:30px;border-radius:9px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;box-shadow:0 2px 8px rgba(224,133,15,.35);}
.logo b{font-size:14.5px;font-weight:800;letter-spacing:-.03em;} .logo small{display:block;font-size:9px;color:var(--muted);font-weight:600;letter-spacing:0;}
.ctx{display:none;align-items:center;min-width:0;font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ctx b{color:var(--muted);font-weight:600;margin:0 7px;flex:0 0 auto;}
.nav{display:flex;align-items:center;flex-wrap:wrap;gap:4px 5px;flex:1 1 auto;min-width:0;}  /* 전부 펼침 + 넘치면 다음 줄로 wrap */
.navb{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:.14s;position:relative;}
.navb .ic{font-size:14px;opacity:.9;display:inline-flex;align-items:center;}
.navb .ic svg{width:16px;height:16px;}
.navb:hover{background:var(--surface-2);color:var(--ink);}
.navb.on{color:var(--ac,var(--brand));background:color-mix(in srgb,var(--ac,var(--brand)) 11%,transparent);font-weight:700;}
.navb.on .ic{opacity:1;}
/* 도구 드롭다운(메뉴 압축 — 12개 가로나열 대신 그룹 드롭다운) */
.navdd{position:relative;flex:0 0 auto;}
.ddbtn .cx{opacity:.55;font-size:10px;margin-left:1px;}
.ddpanel{position:fixed;min-width:240px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh-lg);padding:7px;display:none;z-index:60;max-height:calc(100vh - 70px);overflow-y:auto;}
.ddpanel.on{display:block;}
.ddcap{font-size:9.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:9px 9px 4px;}
.ddcap:first-child{padding-top:4px;}
.dditem{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:9px;border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:left;text-decoration:none;}
.dditem .ic{font-size:14px;width:18px;text-align:center;flex:0 0 auto;}
.dditem:hover{background:var(--surface-2);color:var(--ink);}
.dditem.on{color:var(--ac,var(--brand));background:color-mix(in srgb,var(--ac,var(--brand)) 11%,transparent);font-weight:700;}
.ddsep{height:1px;background:var(--line-2);margin:6px 4px;}
/* 관리자 소프트 게이트 — 미해제 시 관리자 전용 UI 숨김(팀원 콘솔 정리). 공개 정적 페이지라 실제 보안 아님. */
html:not([data-admin="1"]) [data-admin-only]{display:none!important;}
#adminBtn.on{border-color:color-mix(in srgb,var(--brand) 60%,var(--line));color:var(--brand-600);background:var(--brand-50);}
.tr{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.tr a,.tr button{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;text-decoration:none;transition:.14s;}
.tr a:hover,.tr button:hover{border-color:color-mix(in srgb,var(--brand) 55%,var(--line));color:var(--brand-600);background:var(--surface-2);}
.tr .ext{white-space:nowrap;}
/* 본문 */
.body{flex:1 1 auto;min-height:0;position:relative;}
#frame{width:100%;height:100%;border:0;display:none;background:var(--bg);}
#home{width:100%;height:100%;overflow-y:auto;display:block;}
.home-wrap{max-width:1120px;margin:0 auto;padding:40px 24px 72px;}
.hero{display:flex;align-items:flex-start;gap:15px;margin-bottom:6px;}
.hero .hm{width:46px;height:46px;border-radius:13px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex:0 0 auto;box-shadow:0 4px 14px rgba(224,133,15,.3);}
.hero h1{font-size:24px;font-weight:800;letter-spacing:-.035em;line-height:1.15;}
.hero p{font-size:13.5px;color:var(--ink-2);margin-top:7px;line-height:1.7;max-width:700px;}
.hero p b{color:var(--ink);font-weight:700;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(304px,1fr));gap:15px;margin-top:28px;}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:var(--sh);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;position:relative;overflow:hidden;cursor:pointer;}
.card:hover{box-shadow:var(--sh-lg);transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 40%,var(--line));}
.card .ico{width:40px;height:40px;border-radius:11px;background:color-mix(in srgb,var(--ac) 13%,transparent);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:13px;}
.card .ico svg{width:22px;height:22px;}
.card h2{font-size:15.5px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px;}
.card .desc{font-size:12px;color:var(--ink-2);line-height:1.62;flex:1;}
.card .feats{list-style:none;margin:13px 0 0;display:flex;flex-direction:column;gap:6px;padding-top:13px;border-top:1px solid var(--line-2);}
.card .feats li{font-size:11px;color:var(--ink-2);display:flex;gap:7px;line-height:1.45;}
.card .feats li::before{content:"";flex:0 0 5px;width:5px;height:5px;border-radius:50%;background:var(--ac);margin-top:5px;}
.card .go{margin-top:15px;font-size:12px;font-weight:700;color:var(--ac);display:flex;align-items:center;gap:6px;}
.card:hover .go{gap:9px;}
.usage{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);}
.usage .ut{font-size:11.5px;font-weight:800;color:var(--ink-2);letter-spacing:.01em;display:flex;align-items:center;gap:7px;width:100%;}
.usage .um{flex:1;min-width:160px;}
.usage .um .l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);font-weight:600;margin-bottom:5px;}
.usage .um .l b{color:var(--ink);font-weight:800;}
.usage .um .bar{height:7px;border-radius:5px;background:var(--surface-2);overflow:hidden;}
.usage .um .fill{height:100%;border-radius:5px;background:var(--brand);transition:width .4s;}
.usage .um.warn .fill{background:#e2564a;}
.usage .note{width:100%;font-size:10.5px;color:var(--muted);margin-top:1px;line-height:1.6;}
.foot{margin-top:32px;padding-top:22px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.75;}
.foot b{color:var(--ink-2);font-weight:700;} .foot a{color:var(--brand-600);font-weight:700;text-decoration:none;}
.themebtn{width:32px;height:32px;padding:0!important;justify-content:center;font-size:14px;}
.tr button svg,.tr a svg{width:17px;height:17px;}
#homeBtn.on{border-color:color-mix(in srgb,var(--brand) 60%,var(--line));color:var(--brand-600);background:var(--brand-50);}
@media(max-width:760px){.hero h1{font-size:20px;} .tr .ext{display:none;} .logo small{display:none;} .home-wrap{padding:28px 18px 60px;}}
/* ===== 모바일 앱형 UI — 상단은 로고+컨트롤만, 메뉴는 하단 탭바(botnav)로 이동 ===== */
@media(max-width:600px){
  .top{padding:7px 12px;gap:8px;}
  .logo{margin-right:8px;}                    /* 로고(좌) */
  .ctx{display:flex;flex:1 1 auto;}          /* 로고 옆 한 줄에 현재 도구 이름 */
  .nav{display:none;}                        /* 상단 wrap 메뉴 숨김 → 하단 탭바로 */
  .home-wrap{padding:22px 16px 26px;}        /* 하단 탭바가 자체 높이를 차지하므로 하단 여백 축소 */
}
/* 하단 탭바 — 모바일에서만 표시. body(flex column)의 마지막 항목으로 자리를 차지해 본문이 그만큼 줄어 겹침이 없음 */
.botnav{display:none;}
@media(max-width:600px){
  .botnav{display:flex;flex:0 0 auto;z-index:40;align-items:stretch;
    background:color-mix(in srgb,var(--surface) 96%,transparent);
    -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
    border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(15,23,41,.05);
    padding-bottom:env(safe-area-inset-bottom,0);}
  .botnav .bn{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:8px 2px 7px;border:none;background:none;font-family:inherit;font-size:10px;font-weight:600;
    color:var(--muted);cursor:pointer;position:relative;transition:.14s;-webkit-tap-highlight-color:transparent;}
  .botnav .bn .ic{line-height:1;transition:.16s;display:flex;align-items:center;justify-content:center;height:30px;padding:0 13px;border-radius:11px;}
  .botnav .bn .ic svg{width:24px;height:24px;display:block;}
  .botnav .bn .tx{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em;}
  .botnav .bn:active{background:var(--surface-2);}
  .botnav .bn.on{color:var(--ac,var(--brand));}
  .botnav .bn.on .ic{background:var(--ac,var(--brand));color:#fff;box-shadow:0 4px 10px color-mix(in srgb,var(--ac,var(--brand)) 38%,transparent);}
}
/* 전체 메뉴 바텀시트 — '전체' 탭이 열며, 모든 도구+바로가기+관리자 메뉴를 노출 */
.sheet-mask{position:fixed;inset:0;z-index:90;background:rgba(15,23,41,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .25s;}
.sheet-mask.on{opacity:1;visibility:visible;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;background:var(--surface);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;box-shadow:var(--sh-lg);transform:translateY(101%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  max-height:84vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(20px + env(safe-area-inset-bottom,0));}
.sheet.on{transform:translateY(0);}
.sheet .grab{position:sticky;top:0;width:100%;padding:10px 0 4px;background:var(--surface);display:flex;justify-content:center;z-index:1;}
.sheet .grab::before{content:"";width:38px;height:4px;border-radius:3px;background:var(--line);}
.sheet .scap{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 6px 8px;}
.sheet .sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
.sheet .sitem{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 11px;border-radius:14px;border:none;background:none;font-family:inherit;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent;}
.sheet .sitem .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;background:color-mix(in srgb,var(--ac,var(--brand)) 13%,transparent);color:var(--ac,var(--brand));transition:.14s;}
.sheet .sitem .ic svg{width:24px;height:24px;}
.sheet .sitem .tx{font-size:11px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.25;letter-spacing:-.02em;}
.sheet .sitem:active .ic{transform:scale(.94);}
.sheet .sitem.on .ic{box-shadow:0 0 0 2px var(--ac,var(--brand));}
.sheet .sitem.on .tx{color:var(--ink);font-weight:700;}
/* 설정(API 키) 모달 */
.mask{position:fixed;inset:0;z-index:100;background:rgba(15,23,41,.5);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:56px 16px;overflow-y:auto;}
.mask.on{display:flex;}
.modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-lg);overflow:hidden;}
.modal .mh{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line);}
.modal .mh h3{font-size:15px;font-weight:800;letter-spacing:-.02em;flex:1;}
.modal .mh .x{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:15px;}
.modal .mb{padding:16px 20px;max-height:62vh;overflow-y:auto;}
.ksec{font-size:11px;font-weight:800;color:var(--ink-2);letter-spacing:.02em;margin:14px 0 8px;display:flex;align-items:center;gap:7px;}
.ksec:first-child{margin-top:0;}
.ksec .dot{width:7px;height:7px;border-radius:50%;background:var(--ac,var(--brand));}
.krow{display:flex;flex-direction:column;gap:4px;margin-bottom:9px;}
.krow label{font-size:11.5px;color:var(--muted);font-weight:600;}
.krow input{height:36px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:12.5px;letter-spacing:.02em;}
.krow input:focus{outline:none;border-color:var(--brand);background:var(--surface);}
.knote{font-size:11px;color:var(--muted);line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;}
.knote b{color:var(--ink-2);}
.mf{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);}
.mf button{height:38px;border-radius:10px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid var(--line);}
.mf .save{flex:1;background:var(--grad);color:#fff;border:none;box-shadow:0 3px 10px rgba(224,133,15,.3);}
.mf .clear{background:var(--surface);color:var(--ink-2);}
.mf .save:hover{filter:brightness(1.05);} .mf .clear:hover{border-color:#e2564a;color:#e2564a;}
.ktoast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:700;padding:11px 18px;border-radius:10px;box-shadow:var(--sh-lg);opacity:0;transition:.25s;pointer-events:none;}
.ktoast.on{opacity:1;}
</style>
<script>try{var _r=document.documentElement;_r.setAttribute("data-theme",localStorage.getItem("mf_theme")||"light");_r.setAttribute("data-admin",localStorage.getItem("mf_admin")==="1"?"1":"0");}catch(e){document.documentElement.setAttribute("data-theme","light");}</script>
</head>
<body>
<header class="top">
  <a class="logo" href="#" data-tool="home"><span class="m">◆</span><span><b>Modoo</b><small>한화손보 CM 마케팅 콘솔</small></span></a>
  <span class="ctx" id="ctxName"></span>
  <nav class="nav" id="nav"></nav>
  <div class="tr">
    <button class="themebtn" id="homeBtn" data-tool="home" title="홈"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.7 12 3.5l9 7.2"/><path d="M5.5 9.3V20h13V9.3"/><path d="M9.7 20v-5.4h4.6V20"/></svg></button>
    <a class="ext" id="openTab" href="#" target="_blank" rel="noopener" title="현재 화면을 새 탭에서 열기">↗ 새 탭</a>
    <button class="themebtn" id="keyBtn" data-admin-only title="API 키 설정(이 브라우저에만 저장 · 관리자)">⚙</button>
    <button class="themebtn" id="adminBtn" title="관리자 모드">🔒</button>
    <button class="themebtn" id="themeBtn" title="테마 전환">◐</button>
  </div>
</header>
<div class="body">
  <iframe id="frame" title="도구"></iframe>
  <div id="home"></div>
</div>
<!-- 모바일 앱형 하단 탭바 (데스크톱 숨김) — 핵심 도구 + '전체'(바텀시트) -->
<nav class="botnav" id="botnav" aria-label="모바일 메뉴"></nav>
<!-- 전체 메뉴 바텀시트 -->
<div class="sheet-mask" id="sheetMask"></div>
<nav class="sheet" id="sheet" aria-label="전체 메뉴">
  <div class="grab"></div>
  <div id="sheetBody"></div>
</nav>
<!-- API 키 설정 (이 브라우저 localStorage 에만 저장 · 서버·깃 전송/커밋 0) -->
<div class="mask" id="keyMask">
  <div class="modal" role="dialog" aria-modal="true" aria-label="API 키 설정">
    <div class="mh"><h3>⚙ API 키 설정</h3><button class="x" id="keyClose" aria-label="닫기">✕</button></div>
    <div class="mb" id="keyBody"></div>
    <div class="mf"><button class="save" id="keySave">이 브라우저에 저장</button><button class="clear" id="keyClear">전체 지우기</button></div>

async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(String(s)));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}

async function adminUnlock(){

}
function adminLock(){try{localStorage.removeItem(ADMIN_LS);}catch(e){}applyAdmin();renderNav(ACTIVE);ktoast("관리자 모드 OFF");}
async function adminChangePw(){
  const cur=prompt("현재 관리자 비밀번호"); if(cur==null)return;
  if(await sha256(cur)!==adminHash()){ktoast("현재 비밀번호가 틀립니다");return;}
  const nw=prompt("새 비밀번호(이 브라우저에만 저장)"); if(!nw)return;
  try{localStorage.setItem(ADMIN_HASH_LS,await sha256(nw));}catch(e){}
  ktoast("비밀번호 변경됨(이 브라우저)");
}
function renderHome(){
  home.innerHTML=`<div class="home-wrap">
    <div id="usageBox"></div>
    <div class="grid">${TOOLS.map(t=>`<div class="card" data-tool="${t.id}" style="--ac:${t.ac}">
      <div class="ico">${ICON[t.id]||t.icon}</div><h2>${esc(t.name)}</h2>
      <div class="desc">${esc(t.desc)}</div>
      <ul class="feats">${t.feats.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
      <div class="go">열기 →</div></div>`).join("")}</div>
    <div class="foot"><b>연결 구조</b> · 상단 고정 메뉴에서 각 작업공간으로 즉시 전환합니다. 도구들은 같은 담당 상품 집합(홈·장기7·일반2)을 공유합니다. · <a href="${WIKI}" target="_blank" rel="noopener">📖 위키</a><br>
    데이터·카피는 샘플·공개값 기준 · 광고 문구는 배포 전 광고심의 검수 · 검색량/입찰가는 각 광고 플랫폼에서 확정 · 뉴스 요약/시사점은 마케팅 분석(개인정보·영업비밀 미포함).</div>
  </div>`;
}
function show(id,sub){                                  // sub = 툴 내부 딥링크(#해시) 선택
  closeSheet();                                         // 도구 전환 시 바텀시트 닫기
  setCtx(id);                                           // 헤더 한 줄에 도구 이름(홈이면 비움)
  if(id==="home"){home.style.display="block";frame.style.display="none";openTab.href="#";openTab.style.visibility="hidden";renderNav("home");location.hash="";loadUsage();return;}
  const t=TOOLS.find(x=>x.id===id); if(!t)return;
  const suffix=sub||"";
  openTab.href=(LOCAL?t.file:t.url)+suffix; openTab.style.visibility="visible";
  if(LOCAL){ home.style.display="none"; frame.style.display="block"; const src=t.file+suffix; if(frame.getAttribute("src")!==src)frame.src=src; }
  else { window.open(t.url+suffix,"_blank","noopener"); }   // 아티팩트에선 iframe이 막히므로 새 탭
  renderNav(id); location.hash=id;
}
document.addEventListener("click",e=>{
  const act=e.target.closest("[data-act]");
  if(act){e.preventDefault();const a=act.dataset.act;
    if(a==="chpw")adminChangePw(); else if(a==="lock")adminLock(); else if(a==="keys")openKeys(); else if(a==="sheet")toggleSheet(); return;}
  const b=e.target.closest("[data-tool]"); if(b){e.preventDefault();show(b.dataset.tool);return;}
});
document.getElementById("adminBtn").addEventListener("click",()=>{isAdmin()?adminLock():adminUnlock();});
document.getElementById("themeBtn").addEventListener("click",()=>{const c=document.documentElement.getAttribute("data-theme");const isDark=c?c==="dark":matchMedia("(prefers-color-scheme:dark)").matches;const nt=isDark?"light":"dark";document.documentElement.setAttribute("data-theme",nt);try{localStorage.setItem("mf_theme",nt)}catch(_){}; try{if(frame&&frame.contentDocument)frame.contentDocument.documentElement.setAttribute("data-theme",nt);}catch(_){}});

/* ===== API 키 설정 (localStorage 'mf_keys' · 이 브라우저에만) ===== */
/* 같은 오리진이므로 iframe 안 툴들도 이 키를 그대로 읽어 씀 (파일·Secrets에 키 붙일 필요 X) */
const KEYS_LS="mf_keys";
const KEY_SCHEMA=[
  {sec:"CORS 프록시 (URL에서 바로 쓰려면 필수)",ac:"#0e9e8e",fields:[
    {k:"proxy",l:"프록시 URL",ph:"https://내워커.<계정>.workers.dev"}]},
  {sec:"네이버 검색 API (뉴스·데이터랩)",ac:"#e0850f",fields:[
    {k:"naverId",l:"Client ID",ph:"developers.naver.com"},
    {k:"naverSecret",l:"Client Secret",ph:"••••••••"}]},
  {sec:"네이버 검색광고 API (검색량)",ac:"#2b6cb0",fields:[
    {k:"adKey",l:"API Key",ph:"searchad.naver.com"},
    {k:"adSecret",l:"Secret Key",ph:"••••••••"},
    {k:"adCustomer",l:"Customer ID",ph:"숫자"}]},
  {sec:"텔레그램 (데일리 브리프)",ac:"#7c5cd6",fields:[
    {k:"tgToken",l:"Bot Token",ph:"@BotFather"},
    {k:"tgChat",l:"Chat ID",ph:"@userinfobot"}]},
];
function loadKeys(){try{return JSON.parse(localStorage.getItem(KEYS_LS)||"{}")||{};}catch(e){return {};}}
function ktoast(m){const t=document.getElementById("ktoast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1900);}
function renderKeys(){
  const v=loadKeys();
  document.getElementById("keyBody").innerHTML=KEY_SCHEMA.map(s=>
    `<div class="ksec" style="--ac:${s.ac}"><span class="dot"></span>${esc(s.sec)}</div>`+
    s.fields.map(f=>`<div class="krow"><label>${esc(f.l)}</label>
      <input type="password" autocomplete="off" spellcheck="false" data-k="${f.k}" value="${esc(v[f.k]||"")}" placeholder="${esc(f.ph)}"></div>`).join("")
  ).join("")+
  `<div class="knote">👥 <b>팀 전원이 쓰려면</b> — 키를 <b>여기 말고 워커(Cloudflare) 시크릿</b>에 넣으세요. 그러면 팀원은 <b>설정 없이</b> 대시보드만 열면 실시간 데이터가 나옵니다. (프록시 URL은 이미 툴에 기본 내장). 방법 → <b>docs/api-from-url.md</b><br>
   🔒 아래 입력값은 <b>이 브라우저에만</b> 저장되는 <b>개인 override</b>일 뿐(서버·깃 전송/커밋 0) — 워커 시크릿이 없을 때 나 혼자 임시로 쓰거나, 팀 기본값을 덮어쓸 때만 사용합니다.</div>`;
}
function openKeys(){renderKeys();document.getElementById("keyMask").classList.add("on");}
function closeKeys(){document.getElementById("keyMask").classList.remove("on");}
document.getElementById("keyBtn").addEventListener("click",openKeys);
document.getElementById("keyClose").addEventListener("click",closeKeys);
document.getElementById("keyMask").addEventListener("click",e=>{if(e.target.id==="keyMask")closeKeys();});
document.getElementById("keySave").addEventListener("click",()=>{
  const o={};document.querySelectorAll("#keyBody input[data-k]").forEach(i=>{const val=i.value.trim();if(val)o[i.dataset.k]=val;});
  try{localStorage.setItem(KEYS_LS,JSON.stringify(o));ktoast("저장됨 · 이 브라우저에만");closeKeys();}catch(e){ktoast("저장 실패 — 저장공간 확인");}
});
document.getElementById("keyClear").addEventListener("click",()=>{
  if(confirm("저장된 API 키를 이 브라우저에서 모두 지울까요?")){localStorage.removeItem(KEYS_LS);renderKeys();ktoast("모두 지움");}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeKeys();closeSheet();}});
document.getElementById("sheetMask").addEventListener("click",closeSheet);
document.getElementById("sheet").addEventListener("click",e=>{if(e.target.closest("a"))closeSheet();});  // 시트 내 링크 이동 시 닫기

applyAdmin();
renderHome();
loadUsage();
const start=(location.hash||"").replace("#","");
// 레거시 딥링크 보존: 예전 '시즌 캘린더' 카드(#season)는 통합 캘린더의 시즌 탭으로
const LEGACY_HASH={season:["eventcal","#season"]};
renderNav("home");
const lg=LEGACY_HASH[start];
if(lg&&LOCAL){show(lg[0],lg[1]);}
else if(start&&TOOLS.some(t=>t.id===start)&&LOCAL){show(start);}
else {show("home");}
</script>
</body>
</html>
