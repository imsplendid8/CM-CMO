 {key:"golf",cat:"장기",name:"골프보험",tier:"중형",core:["골프보험","홀인원보험","다이렉트 골프보험"],special:["홀인원","배상책임","캐디","용품손해"],serpKw:"골프보험"},
 {key:"cncr",cat:"장기",name:"암보험",tier:"중형",core:["암보험","다이렉트 암보험","내가고른 암보험"],special:["유사암","진단비","소액암","표적항암","재발암"],serpKw:"암보험"},

 {key:"holeinone",cat:"일반",name:"홀인원보험",tier:"니치",core:["홀인원보험","캐롯 홀인원보험","골프 홀인원보험"],special:["홀인원축하비용","기념품","라운딩","동반플레이어"],serpKw:"홀인원보험"},
 {key:"event",cat:"일반",name:"행사배상책임보험",tier:"니치",core:["행사배상책임보험","행사보험","캐롯 행사보험"],special:["공연행사","체육행사","불꽃놀이","수상활동","배상책임"],serpKw:"행사보험"},
 {key:"chronic",cat:"장기",name:"유병자 간편보험",tier:"니치",core:["유병자보험","간편심사보험","유병력자보험"],special:["간편심사","고혈압","당뇨","3.5.5","5.10.5"],serpKw:"유병자보험"}

function tokens(p){const values=[p.name,...p.core,...p.special].map(String);return uniq([...values.map(v=>v.replace(/[\s·/()]/g,"")),...values.flatMap(v=>v.split(/[·\s/()]/))].filter(v=>v.length>=2&&!GENERIC.has(v)))}
function forbidden(p,text){const value=String(text).replace(/\s/g,"").toLowerCase();return [...GLOBAL_EXCLUDED,...(p.excluded||[])].some(x=>value.includes(String(x).replace(/\s/g,"").toLowerCase()))}
function relationRank(p,text){const value=String(text).replace(/[\s·/()]/g,""),core=uniq([p.name,p.serpKw,...p.core].map(v=>String(v).replace(/[\s·/()]/g,""))),special=p.special.map(v=>String(v).replace(/[\s·/()]/g,"")).filter(v=>v.length>=2&&!AMBIGUOUS.has(v));if(core.some(t=>value.includes(t)))return 0;if(special.some(t=>value.includes(t)))return 1;return 9}
function inScope(p,text){return !forbidden(p,text)&&relationRank(p,text)<9}
function volumeRows(p){const rows=DATA.volume.products?.[p.key]?.keywords||{};return Object.entries(rows).map(([kw,v])=>({kw,pc:Number(v.pc||0),mobile:Number(v.mobile||0),total:Number(v.pc||0)+Number(v.mobile||0),comp:v.comp||"-",rank:relationRank(p,kw)})).filter(x=>x.total>0&&!forbidden(p,x.kw)&&x.rank<9).sort((a,b)=>a.rank-b.rank||b.total-a.total)}
function activeIssue(p){const rows=DATA.seasonal.seasonal?.[p.key]||[];return rows.find(x=>(x.m||[]).includes(month))||rows.find(x=>(x.m||[]).includes(nextMonth()))||null}
function cropTitle(text){let value=HUMANIZE.light(String(text).replace(/\s+/g," ").trim());if(clen(value)<=TITLE.max)return value;const cut=[...value].slice(0,TITLE.max).join("");const at=cut.lastIndexOf(" ");return (at>=TITLE.min?cut.slice(0,at):cut).replace(/[,:·]+$/g,"")}
function titleCandidates(p){const row=DATA.titles.products?.find(x=>x.product_key===p.key),out=[],seen=new Set();const add=c=>{const raw=HUMANIZE.light(String(c.title||"").replace(/\s+/g," ").replace(/보험비교\s+비교할 때/g,"보험 비교할 때").replace(/비교\s+비교할 때/g,"비교할 때").trim()),title=c.source==="SEO 검색 근거"?raw:cropTitle(raw),scope=c.target_query||title;if(clen(title)<TITLE.min||clen(title)>TITLE.max||seen.has(title)||!inScope(p,scope))return;seen.add(title);out.push({...c,title,title_length:clen(title)})};
  (row?.candidates||[]).filter(c=>c.decision!=="rejected_cannibalization").forEach(c=>add({...c,source:"SEO 검색 근거"}));
  const demand=volumeRows(p),head=demand[0]?.kw||p.serpKw,issue=activeIssue(p),fallback=[
    {title:`${head} 가입 전 확인할 조건`,target_query:head,search_demand:demand[0]?.total||0,competition:demand[0]?.comp||"-",pattern:"situation_first"},
    {title:`${head} 보장 범위와 체크포인트`,target_query:head,search_demand:demand[0]?.total||0,competition:demand[0]?.comp||"-",pattern:"subject_first"},
    {title:`${p.special[0]} 보장, 무엇을 확인할까요`,target_query:demand.find(x=>x.kw.includes(p.special[0]))?.kw||head,search_demand:demand.find(x=>x.kw.includes(p.special[0]))?.total||0,competition:demand.find(x=>x.kw.includes(p.special[0]))?.comp||"-",pattern:"scope_limited"},
    issue?{title:`${issue.tag} 전 ${p.serpKw} 체크리스트`,target_query:head,search_demand:demand[0]?.total||0,competition:demand[0]?.comp||"-",pattern:"seasonal"}:null
  ].filter(Boolean);fallback.forEach(c=>add({...c,id:`${p.key}-fallback-${out.length+1}`,source:"상품·검색 수요",gsc_status:"not_connected",weakness:"랜딩 본문과 제목의 주제가 일치하는지 확인",decision:"review_only"}));
  return out.slice(0,3)
}
function descriptionFor(p,c){const q=c.target_query||p.serpKw,sp=p.special.slice(0,2).join("·");let text=`${josa(q,"을","를")} 알아보는 분을 위해 ${sp} 관련 보장과 가입 조건을 정리합니다. 보험료와 보장 범위, 보장하지 않는 경우를 함께 살펴보고 실제 보장 내용은 상품설명서와 약관에서 확인하세요.`;if(clen(text)<DESC.min)text+=` 가입 전 필요한 항목을 체크리스트로 확인해 보세요.`;if(clen(text)>DESC.max){const short=`${josa(q,"을","를")} 알아보는 분을 위해 ${sp} 관련 보장, 가입 조건과 보험료를 정리합니다. 보장 범위와 제외 조건을 함께 살펴보고 실제 내용은 상품설명서와 약관에서 확인하세요.`;text=clen(short)<=DESC.max?short:[...short].slice(0,DESC.max).join("")}return HUMANIZE.light(text)}
function briefFor(p,c){const q=c.target_query||p.serpKw,issue=activeIssue(p),desc=descriptionFor(p,c);return {desc,issue,summary:[`${q} 검색자가 궁금해하는 가입 조건과 보장 범위를 먼저 설명합니다.`,`${p.special[0]}·${p.special[1]} 관련 보장은 지급 요건과 제외 조건을 함께 확인합니다.`,"보험료·담보 선택은 개인 조건에 따라 달라지므로 상품설명서와 약관을 기준으로 정리합니다."],outline:[`${josa(q,"을","를")} 찾는 이유와 필요한 상황`,`${p.special[0]}·${p.special[1]} 보장 확인`,`가입 조건과 보험료 확인 방법`,`보장하지 않는 경우와 유의사항`,`${q} 가입 전 체크리스트`],faq:[`${josa(q,"은","는")} 어떤 보장을 확인해야 하나요?`,`${p.special[0]} 관련 보장은 어떤 조건에서 적용되나요?`,`보장받지 못할 수 있는 경우는 무엇인가요?`,`가입 전에 비교할 항목은 무엇인가요?`]}}
function gscLabel(c){const map={top3:"상위 노출",striking_distance:"4~20위 개선 기회",low_visibility:"노출 확대 필요",no_signal:"GSC 신호 없음",not_connected:"GSC 확인 필요"};return map[c.gsc_status]||"GSC 확인 필요"}
function sourceDate(value){return /^\d{4}-\d{2}-\d{2}/.test(value||"")?value.slice(0,10):"기준일 없음"}
function renderNav(){let html="";[...new Set(PRODUCTS.map(p=>p.cat))].forEach(cat=>{html+=`<div class="sb-cap">${esc(cat)}</div>`;PRODUCTS.filter(p=>p.cat===cat).forEach(p=>{html+=`<button class="sb-item${p.key===currentKey?" on":""}" data-product="${esc(p.key)}">${esc(p.name)}</button>`})});$("#productNav").innerHTML=html}
function render(){const p=product(),candidates=titleCandidates(p);if(!candidates.some(x=>x.id===selectedId))selectedId=candidates[0]?.id||"";const chosen=candidates.find(x=>x.id===selectedId)||candidates[0],brief=chosen?briefFor(p,chosen):null,vol=volumeRows(p),top=vol[0],gsc=DATA.titles.sources?.gsc||"not_connected";$("#pageSub").textContent=`${p.name} · ${month}월 실행 → ${nextMonth()}월 준비`;
  const candidateHtml=candidates.map((c,i)=>`<button class="candidate${c.id===selectedId?" on":""}" data-candidate="${esc(c.id)}"><div class="candidate-top"><span class="candidate-title">${esc(c.title)}</span><span class="pill good">${clen(c.title)}자</span><span class="pill${c.gsc_status==="not_connected"||c.gsc_status==="no_signal"?" warn":""}">${esc(gscLabel(c))}</span></div><div class="candidate-meta">${esc(c.target_query||p.serpKw)} · 월 ${Number(c.search_demand||0).toLocaleString("ko-KR")}회 · 경쟁 ${esc(c.competition||"-")} · ${esc(c.source||"검색 근거")}</div><div class="candidate-weak">검토 포인트 · ${esc(c.weakness||"본문과 제목의 약속이 일치하는지 확인")}</div></button>`).join("");
  const checks=chosen&&brief?[{ok:inScope(p,(chosen.target_query||"")+chosen.title),text:"상품 범위와 검색어 일치"},{ok:clen(chosen.title)>=TITLE.min&&clen(chosen.title)<=TITLE.max,text:`제목 ${TITLE.min}~${TITLE.max}자`},{ok:clen(brief.desc)>=DESC.min&&clen(brief.desc)<=DESC.max,text:`설명 ${DESC.min}~${DESC.max}자`},{ok:Number(chosen.search_demand||0)>0,text:"SearchAd 월검색량 근거"}]:[];const pass=checks.filter(x=>x.ok).length;
  $("#content").innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">POWER CONTENT WORKSPACE</div><h1>검색 의도에서 소재와 본문까지,<br>한 번에 검토하는 브리프</h1><p>담당 상품 범위 안에서 SearchAd 검색수요·SEO 제목 근거·시즌 이슈를 연결합니다. GSC가 확인되지 않으면 추천을 확정하지 않고 검토 후보로만 제공합니다.</p></div><div class="source-card"><div class="source-title">근거 데이터</div><div class="source-row"><span>SearchAd 검색량</span><b>${esc(sourceDate(DATA.volume.asof))}</b></div><div class="source-row"><span>파워콘텐츠 제목 근거</span><b>${esc(sourceDate(DATA.titles.asof))}</b></div><div class="source-row"><span>시즌 캘린더</span><b>${esc(sourceDate(DATA.seasonal.asof))}</b></div><div class="source-row"><span>GSC</span><span class="state${gsc!=="connected"?" warn":""}">${gsc==="connected"?"연결":"확인 필요"}</span></div></div></section>
  <section class="metrics"><div class="metric"><div class="label">검토 후보</div><div class="value">${candidates.length}안</div><div class="sub">중복·범위 밖 후보 제외</div></div><div class="metric"><div class="label">대표 검색어</div><div class="value">${esc(top?.kw||p.serpKw)}</div><div class="sub">월 ${Number(top?.total||0).toLocaleString("ko-KR")}회 · ${esc(top?.comp||"-")}</div></div><div class="metric"><div class="label">자동 점검</div><div class="value">${pass}/4</div><div class="sub">범위·길이·검색 근거</div></div><div class="metric"><div class="label">시즌 연결</div><div class="value">${esc(brief?.issue?.tag||"상시")}</div><div class="sub">${brief?.issue?`${month}월 또는 ${nextMonth()}월 이슈`:"해당 월 직접 이슈 없음"}</div></div></section>
  <div class="workspace"><div><section class="panel"><div class="panel-head"><div><h2>소재 제목 3안</h2><p>순위가 아닌 검토 후보입니다. 선택하면 오른쪽 브리프가 함께 바뀝니다.</p></div><span class="pill warn">추천 확정 아님</span></div><div class="candidate-list">${candidateHtml||'<div class="empty">상품 범위와 규격을 통과한 후보가 없습니다.</div>'}</div></section>
  ${chosen&&brief?`<section class="panel"><div class="panel-head"><div><h2>선택 소재와 콘텐츠 설계</h2><p>키워드–소재–랜딩 본문의 주제를 한 브리프로 맞춥니다.</p></div></div><div class="brief-grid"><div class="brief-block wide"><h3>소재 설명</h3><div class="brief-line"><span class="copy-text">${esc(brief.desc)}</span><span class="count">${clen(brief.desc)}자</span><button class="mini-copy" data-copy="${esc(brief.desc)}">복사</button></div></div><div class="brief-block"><h3>본문 3줄 요약</h3><ol>${brief.summary.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div><div class="brief-block"><h3>권장 목차</h3><ol>${brief.outline.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div><div class="brief-block wide"><h3>FAQ 후보</h3><ol>${brief.faq.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div></div></section>`:""}</div>
  <aside class="side-col">${chosen&&brief?`<section class="panel"><div class="panel-head"><div><h2>게재 전 검수</h2><p>자동 점검과 사람 확인을 구분합니다.</p></div></div><ul class="check-list">${checks.map(x=>`<li><span class="check ${x.ok?"ok":"wait"}">${x.ok?"✓":"!"}</span><span>${esc(x.text)}</span></li>`).join("")}<li><span class="check wait">!</span><span>GSC 실제 노출·대상 페이지 확인</span></li><li><span class="check wait">!</span><span>최신 상품자료·약관·준법·광고심의 확인</span></li></ul></section><section class="panel"><div class="panel-head"><div><h2>선택 근거</h2><p>제목에 사용한 신호만 표시합니다.</p></div></div><div class="evidence"><div class="evidence-row"><b>${esc(chosen.target_query||p.serpKw)}</b><span>SearchAd 월 ${Number(chosen.search_demand||0).toLocaleString("ko-KR")}회 · 경쟁 ${esc(chosen.competition||"-")}</span></div><div class="evidence-row"><b>${esc(brief.issue?.tag||"상시 콘텐츠")}</b><span>${esc(brief.issue?.why||"선택 월의 직접 시즌 이슈가 없어 상시 검색 의도로 구성")}</span></div><div class="evidence-row"><b>${esc(gscLabel(chosen))}</b><span>${esc(chosen.weakness||"본문과 제목의 약속 일치 여부 확인")}</span></div></div></section>`:""}</aside></div>`;
  renderNav()
}
function fullBrief(){const p=product(),c=titleCandidates(p).find(x=>x.id===selectedId)||titleCandidates(p)[0];if(!c)return"";const b=briefFor(p,c);return [`[파워콘텐츠 소재 브리프]`, `상품: ${p.name}`,`기준월: ${month}월 → ${nextMonth()}월`,`타깃 검색어: ${c.target_query||p.serpKw} (월 ${Number(c.search_demand||0).toLocaleString("ko-KR")}회)`,`제목: ${c.title} (${clen(c.title)}자)`,`설명: ${b.desc} (${clen(b.desc)}자)`,``,"[본문 3줄 요약]",...b.summary.map((x,i)=>`${i+1}. ${x}`),``,"[권장 목차]",...b.outline.map((x,i)=>`${i+1}. ${x}`),``,"[FAQ 후보]",...b.faq.map((x,i)=>`${i+1}. ${x}`),``,"[검수] GSC·최신 상품자료·약관·준법·광고심의 확인 필요"].join("\n")}
function copyText(value){if(!value)return;navigator.clipboard?.writeText(value).then(()=>toast("복사했습니다")).catch(()=>{const ta=document.createElement("textarea");ta.value=value;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("복사했습니다")})}
function csvCell(value){return `"${String(value??"").replace(/"/g,'""')}"`}
function exportCsv(){const p=product(),rows=[["상품","제목","제목글자수","타깃검색어","월검색량","경쟁도","설명","설명글자수","시즌이슈","상태","근거기준일"]];titleCandidates(p).forEach(c=>{const b=briefFor(p,c);rows.push([p.name,c.title,clen(c.title),c.target_query||p.serpKw,c.search_demand||0,c.competition||"-",b.desc,clen(b.desc),b.issue?.tag||"상시","사람 검토 필요",sourceDate(DATA.titles.asof)])});const blob=new Blob(["\ufeff"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${p.name}_파워콘텐츠_브리프_${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast("검토용 CSV를 내보냈습니다")}
document.addEventListener("click",e=>{const p=e.target.closest("[data-product]");if(p){currentKey=p.dataset.product;selectedId="";render();window.scrollTo({top:0})}const c=e.target.closest("[data-candidate]");if(c){selectedId=c.dataset.candidate;render()}const cp=e.target.closest("[data-copy]");if(cp)copyText(cp.dataset.copy)});
$("#planMonth").innerHTML=PLANNING.optionMarkup(month);$("#planMonth").addEventListener("change",e=>{month=PLANNING.setMonth(e.target.value);selectedId="";render()});
$("#copyBrief").addEventListener("click",()=>copyText(fullBrief()));$("#exportCsv").addEventListener("click",exportCsv);
$("#themeBtn").addEventListener("click",()=>{const root=document.documentElement,dark=root.getAttribute("data-theme")==="dark",next=dark?"light":"dark";root.setAttribute("data-theme",next);try{localStorage.setItem("mf_theme",next)}catch(_){}});
render();
Promise.all([
 fetch("data/volume.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(x=>{if(x)DATA.volume=x}).catch(()=>{}),
 fetch("data/seasonal.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(x=>{if(x)DATA.seasonal=x}).catch(()=>{}),
 fetch("data/adcopy/powercontent-title-opportunities.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(x=>{if(x)DATA.titles=x}).catch(()=>{})
]).then(render);
</script>
