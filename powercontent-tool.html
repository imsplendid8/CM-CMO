  $("#content").innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">KEYWORD-LED POWER CONTENT</div><h1>키워드를 고르면 콘텐츠 소재부터<br>본문 초안·광고 문안까지 제안합니다</h1><p>이미 쓴 포스트를 입력하는 방식이 아닙니다. SearchAd 검색수요와 시즌 맥락으로 콘텐츠를 기획하고, 근거가 없는 상품 세부 내용은 단정하지 않습니다.</p></div><div class="source-card"><div class="source-title">기획 근거</div><div class="source-row"><span>SearchAd 검색량</span><b>${esc(sourceDate(DATA.volume.asof))}</b></div><div class="source-row"><span>콘텐츠 제목 근거</span><b>${esc(sourceDate(DATA.titles.asof))}</b></div><div class="source-row"><span>시즌 캘린더</span><b>${esc(sourceDate(DATA.seasonal.asof))}</b></div><div class="source-row"><span>승인 상품 근거</span><b>${brief?.claims.length||0}건</b></div></div></section>
  <section class="metrics"><div class="metric"><div class="label">콘텐츠 소재</div><div class="value">${candidates.length}안</div><div class="sub">제목을 선택하면 전체 초안 변경</div></div><div class="metric"><div class="label">대표 키워드</div><div class="value">${esc(k?.primary.kw||p.serpKw)}</div><div class="sub">월 ${Number(k?.primary.total||0).toLocaleString("ko-KR")}회 · ${esc(k?.primary.comp||"-")}</div></div><div class="metric"><div class="label">활용 키워드</div><div class="value">${k?.all.length||0}개</div><div class="sub">연관·본문 보조·시즌 키워드</div></div><div class="metric"><div class="label">상품 근거</div><div class="value">${brief?.evidenceStatus==="verified"?"승인":"확인 필요"}</div><div class="sub">${brief?.claims.length?`${brief.claims.length}개 claim 연결`:"일반 정보 초안만 제안"}</div></div></section>
  <div class="workspace"><div>
    <section class="panel"><div class="panel-head"><div><h2>1. 키워드 전략</h2><p>대표 키워드를 제목·도입부에, 연관·보조 키워드를 본문과 FAQ에 배치합니다.</p></div></div><div class="keyword-lanes"><div class="keyword-lane"><b>대표 키워드</b><div class="keyword-chips">${keywordChips(k?[k.primary]:[],true)}</div></div><div class="keyword-lane"><b>연관 키워드</b><div class="keyword-chips">${keywordChips(k?.related)}</div></div><div class="keyword-lane"><b>본문 보조</b><div class="keyword-chips">${keywordChips(k?.support)}</div></div><div class="keyword-lane"><b>시즌 키워드</b><div class="keyword-chips">${k?.seasonal.length?keywordChips(k.seasonal):'<span class="keyword-chip">이번 기획월 직접 시즌 키워드 없음</span>'}</div></div></div></section>
    <section class="panel"><div class="panel-head"><div><h2>2. 콘텐츠 소재 3안</h2><p>광고 제목만이 아니라 선택한 주제의 전체 콘텐츠가 함께 바뀝니다.</p></div></div><div class="candidate-list">${candidateHtml||'<div class="empty">상품 범위와 규격을 통과한 후보가 없습니다.</div>'}</div></section>
    ${brief?`<section class="panel"><div class="panel-head"><div><h2>3. 선택 소재 설계</h2><p>검색 의도와 독자 질문을 콘텐츠 약속으로 구체화합니다.</p></div></div><div class="brief-grid"><div class="brief-block"><h3>검색 의도</h3><p>${esc(brief.intent)}</p></div><div class="brief-block"><h3>타깃 독자</h3><p>${esc(brief.reader)}</p></div><div class="brief-block wide"><h3>콘텐츠 각도</h3><p>${esc(brief.angle)}</p></div><div class="brief-block wide"><h3>도입 훅</h3><p>${esc(brief.hook)}</p></div><div class="brief-block wide"><h3>도입부 초안 · 향후 광고 설명으로 사용</h3><div class="brief-line"><span class="copy-text">${esc(brief.intro)}</span><span class="count">${clen(brief.intro)}자</span><button class="mini-copy" data-copy="${esc(brief.intro)}">복사</button></div><p class="candidate-meta">이 문장을 발행 본문에 그대로 포함하면 네이버 광고 설명 후보로 이어집니다.</p></div><div class="brief-block wide"><h3>본문 3줄 요약</h3><ol>${brief.summary.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div></div></section>
    <section class="panel"><div class="panel-head"><div><h2>4. 본문 초안</h2><p>목차만 주는 것이 아니라 섹션별 작성 문장까지 제공합니다.</p></div></div><div class="draft-list">${draftHtml}</div></section>
    <section class="panel"><div class="panel-head"><div><h2>5. FAQ·마무리 소재</h2><p>검색자의 후속 질문과 발행용 마무리 요소입니다.</p></div></div><div class="brief-grid"><div class="brief-block wide"><h3>FAQ 초안</h3><div class="faq-list">${faqHtml}</div></div><div class="brief-block"><h3>CTA</h3><p>${esc(brief.cta)}</p></div><div class="brief-block"><h3>대표 이미지 브리프</h3><p>${esc(brief.imageBrief)}</p></div></div></section>`:""}</div>
    <aside>${brief?`<section class="panel"><div class="panel-head"><div><h2>광고 소재 제안</h2><p>콘텐츠와 같은 대표 키워드를 사용합니다.</p></div></div><div class="register-list"><div class="register-row"><b>제목</b><span>${esc(brief.ad.title)} · ${clen(brief.ad.title)}자</span></div><div class="register-row"><b>설명</b><span>${esc(brief.ad.description)} · ${clen(brief.ad.description)}자</span></div></div><div class="status-card" style="margin-top:10px">${esc(brief.ad.note)}</div></section>
    <section class="panel"><div class="panel-head"><h2>키워드 배치</h2></div><ul class="check-list"><li><span class="check ok">1</span><span>제목·도입부: ${esc(k.primary.kw)}</span></li><li><span class="check ok">2</span><span>본문 H2: ${esc(k.related.slice(0,3).map(x=>x.kw).join(" · ")||k.primary.kw)}</span></li><li><span class="check ok">3</span><span>FAQ: ${esc(k.support.map(x=>x.kw).join(" · "))}</span></li></ul></section>
    <section class="panel"><div class="panel-head"><h2>자동 점검</h2></div><ul class="check-list">${checks.map(x=>`<li><span class="check ${x.ok?"ok":"wait"}">${x.ok?"✓":"!"}</span><span>${esc(x.text)}</span></li>`).join("")}<li><span class="check wait">!</span><span>최신 상품자료·약관·준법·광고심의 확인</span></li></ul></section>
    <section class="panel"><div class="panel-head"><h2>상품 근거 상태</h2></div><div class="status-card${brief.evidenceStatus==="verified"?" ok":""}">${brief.evidenceStatus==="verified"?`승인 claim ${brief.claimIds.map(esc).join(" · ")}`:"승인된 power_content claim이 없어 세부 보장·금액을 단정하지 않은 일반 정보 초안입니다."}</div><a class="guide-link" href="${esc(MATERIAL_SPEC.powerContentGuideUrl)}" target="_blank" rel="noopener">네이버 파워콘텐츠 소재 가이드 ↗</a></section>`:""}</aside></div>`;renderNav()}
function csvCell(value){return `"${String(value??"").replace(/"/g,'""')}"`}
function exportCsv(){const p=product(),c=titleCandidates(p).find(x=>x.id===selectedId)||titleCandidates(p)[0];if(!c)return;const b=contentBriefFor(p,c),k=b.keywords,rows=[["상품","기준월","검색 의도","대표 키워드","월검색량","연관 키워드","본문 보조 키워드","시즌 키워드","콘텐츠 제목","콘텐츠 각도","도입부·광고 설명","본문 초안","FAQ 초안","CTA","대표 이미지 브리프","claim IDs","근거 상태"]];rows.push([p.name,`${month}월`,b.intent,k.primary.kw,k.primary.total,k.related.map(x=>x.kw).join(" · "),k.support.map(x=>x.kw).join(" · "),k.seasonal.map(x=>x.kw).join(" · "),c.title,b.angle,b.intro,b.draft.map((x,i)=>`${i+1}. ${x.heading}\n${x.body}`).join("\n\n"),b.faq.map((x,i)=>`${i+1}. ${x.q}\n${x.a}`).join("\n\n"),b.cta,b.imageBrief,b.claimIds.join(" · "),b.evidenceStatus]);const blob=new Blob(["\ufeff"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${p.name}_파워콘텐츠_콘텐츠브리프_${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast("선택한 콘텐츠 브리프를 내보냈습니다")}
document.addEventListener("click",e=>{const p=e.target.closest("[data-product]");if(p){currentKey=p.dataset.product;selectedId="";render();window.scrollTo({top:0})}const c=e.target.closest("[data-candidate]");if(c){selectedId=c.dataset.candidate;render()}const cp=e.target.closest("[data-copy]");if(cp)copyText(cp.dataset.copy)});
$("#planMonth").innerHTML=PLANNING.optionMarkup(month);$("#planMonth").addEventListener("change",e=>{month=PLANNING.setMonth(e.target.value);selectedId="";render()});
$("#copyBrief").addEventListener("click",()=>copyText(fullBrief()));
$("#exportCsv").addEventListener("click",exportCsv);
$("#themeBtn").addEventListener("click",()=>{const root=document.documentElement,dark=root.getAttribute("data-theme")==="dark",next=dark?"light":"dark";root.setAttribute("data-theme",next);try{localStorage.setItem("mf_theme",next)}catch(_){}});
render();
Promise.all([
 fetch("data/volume.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(x=>{if(x)DATA.volume=x}).catch(()=>{}),
 fetch("data/seasonal.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(x=>{if(x)DATA.seasonal=x}).catch(()=>{}),
 fetch("data/adcopy/powercontent-title-opportunities.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(x=>{if(x)DATA.titles=x}).catch(()=>{}),
 fetch("data/evidence/claims.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(x=>{if(x)DATA.claims=x}).catch(()=>{})
]).then(render);
</script>
