const HUMANIZE=window.ModooHumanizeKo||{light:s=>String(s)};
const PRODUCTS=[
 {key:"home",cat:"사이트",name:"다이렉트 홈(브랜드)",core:["한화손보 다이렉트","한화 다이렉트보험","한화손해보험 다이렉트"],special:["운전자보험","장기보험","다이렉트보험"],excluded:["자동차보험"],serpKw:"한화손보 다이렉트"},

 {key:"cncr",cat:"장기",name:"암보험",core:["암보험","다이렉트 암보험","내가고른 암보험"],special:["유사암","진단비","소액암","표적항암"],serpKw:"암보험"},

 {key:"birth",cat:"장기",name:"임신·출산(태아)보험",core:["태아보험","임신보험","출산보험"],special:["태아","선천이상","미숙아","산모"],serpKw:"태아보험"},

 {key:"overseaslong",cat:"일반",name:"해외장기체류보험",core:["해외장기체류보험","장기여행보험","유학생보험"],special:["유학","장기체류","워홀","어학연수"],serpKw:"유학생보험"},
 {key:"holeinone",cat:"일반",name:"홀인원보험",core:["홀인원보험","캐롯 홀인원보험","골프 홀인원보험"],special:["홀인원축하비용","기념품","라운딩","동반플레이어"],serpKw:"홀인원보험"},
 {key:"event",cat:"일반",name:"행사배상책임보험",core:["행사배상책임보험","행사보험","캐롯 행사보험"],special:["공연행사","체육행사","불꽃놀이","배상책임"],serpKw:"행사보험"},
 {key:"chronic",cat:"장기",name:"유병자 간편보험",core:["유병자보험","간편심사보험","유병력자보험"],special:["간편심사","고혈압","당뇨","3.5.5"],serpKw:"유병자보험"}
];
const MATERIAL_SPEC=globalThis.ModooNaverMaterialSpecs;
const AD_REVIEW=globalThis.ModooInsuranceAdReview;
const POWER_SPEC=MATERIAL_SPEC.powerContent;
const TITLE={min:POWER_SPEC.title.minLength,max:POWER_SPEC.title.maxLength};
const GLOBAL_EXCLUDED=["자동차보험","자동차 보험","공개관측","공개 관측","한화생명","고객센터","콜센터","전화번호","보험금청구","삼성화재","DB손해","DB운전자","현대해상","KB손해","메리츠","라이나","AXA"];
const AMBIGUOUS=new Set(["배상책임","임신","출산","실손"]);
let DATA={volume:{products:{}},seasonal:{seasonal:{}},titles:{products:[],sources:{}}};
let currentKey="driver",selectedId="",month=PLANNING.getMonth();
const product=()=>PRODUCTS.find(p=>p.key===currentKey)||PRODUCTS[0];
const nextMonth=()=>PLANNING.nextMonth(month);
function toast(message){const el=$("#toast");el.textContent=message;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1700)}
function forbidden(p,text){const value=String(text).replace(/\s/g,"").toLowerCase();return [...GLOBAL_EXCLUDED,...(p.excluded||[])].some(x=>value.includes(String(x).replace(/\s/g,"").toLowerCase()))}
function relationRank(p,text){const value=String(text).replace(/[\s·/()]/g,""),core=uniq([p.name,p.serpKw,...p.core].map(v=>String(v).replace(/[\s·/()]/g,""))),special=p.special.map(v=>String(v).replace(/[\s·/()]/g,"")).filter(v=>v.length>=2&&!AMBIGUOUS.has(v));if(core.some(t=>value.includes(t)))return 0;if(special.some(t=>value.includes(t)))return 1;return 9}
function inScope(p,text){return !forbidden(p,text)&&relationRank(p,text)<9}
function volumeRows(p){const rows=DATA.volume.products?.[p.key]?.keywords||{};return Object.entries(rows).map(([kw,v])=>({kw,total:Number(v.pc||0)+Number(v.mobile||0),comp:v.comp||"-",rank:relationRank(p,kw)})).filter(x=>x.total>0&&!forbidden(p,x.kw)&&x.rank<9).sort((a,b)=>a.rank-b.rank||b.total-a.total)}
function activeIssue(p){const rows=DATA.seasonal.seasonal?.[p.key]||[];return rows.find(x=>(x.m||[]).includes(month))||rows.find(x=>(x.m||[]).includes(nextMonth()))||null}
function cropTitle(text){let value=HUMANIZE.light(String(text).replace(/\s+/g," ").trim());if(clen(value)<=TITLE.max)return value;const cut=[...value].slice(0,TITLE.max).join(""),at=cut.lastIndexOf(" ");return (at>=TITLE.min?cut.slice(0,at):cut).replace(/[,:·]+$/g,"")}
function titleCandidates(p){const row=DATA.titles.products?.find(x=>x.product_key===p.key),out=[],seen=new Set();const add=c=>{const raw=HUMANIZE.light(String(c.title||"").replace(/\s+/g," ").replace(/보험비교\s+비교할 때/g,"보험 비교할 때").replace(/비교\s+비교할 때/g,"비교할 때").trim()),title=cropTitle(raw),scope=c.target_query||title;if(clen(title)<TITLE.min||clen(title)>TITLE.max||seen.has(title)||/(?:기준과|주의사항과|그리고|및)$/.test(title)||!inScope(p,scope)||AD_REVIEW.review(title,{channel:"powercontent"}).generationBlocking)return;seen.add(title);out.push({...c,id:c.id||`${p.key}-${out.length+1}`,title,title_length:clen(title)})};
  (row?.candidates||[]).filter(c=>c.decision!=="rejected_cannibalization").forEach(c=>add({...c,source:"검색 제목 근거"}));
  const demand=volumeRows(p),head=demand[0]?.kw||p.serpKw,issue=activeIssue(p),specialDemand=demand.find(x=>x.kw.includes(p.special[0])),fallback=[
    {title:`${head}, 가입 전에 무엇을 볼까`,target_query:head,search_demand:demand[0]?.total||0,competition:demand[0]?.comp||"-",pattern:"search_intent"},
    {title:`${p.special[0]} 특약을 볼 때 놓치기 쉬운 점`,target_query:specialDemand?.kw||head,search_demand:specialDemand?.total||0,competition:specialDemand?.comp||"-",pattern:"coverage_context"},
    {title:`${p.serpKw} 보험료가 달라지는 기준`,target_query:head,search_demand:demand[0]?.total||0,competition:demand[0]?.comp||"-",pattern:"price_factors"},
    issue?{title:`${issue.tag}, ${p.serpKw}이 필요한 순간`,target_query:head,search_demand:demand[0]?.total||0,competition:demand[0]?.comp||"-",pattern:"seasonal"}:null
  ].filter(Boolean);fallback.forEach(c=>add({...c,source:"상품·검색 수요",decision:"review_only"}));return out.slice(0,3)}
function adDraftFor(c){return {title:c.title,description:"",landingUrl:"",image:"",businessName:"한화손보 다이렉트",publishedAt:"",profileImage:"연동"}}
function reviewPowerMaterial(p,c){return AD_REVIEW.reviewFields({title:c.title},{channel:"powercontent",product:p.key})}
function sourceDate(value){return /^\d{4}-\d{2}-\d{2}/.test(value||"")?value.slice(0,10):"기준일 없음"}
function renderNav(){let html="";[...new Set(PRODUCTS.map(p=>p.cat))].forEach(cat=>{html+=`<div class="sb-cap">${esc(cat)}</div>`;PRODUCTS.filter(p=>p.cat===cat).forEach(p=>{html+=`<button class="sb-item${p.key===currentKey?" on":""}" data-product="${esc(p.key)}">${esc(p.name)}</button>`})});$("#productNav").innerHTML=html}
function render(){const p=product(),candidates=titleCandidates(p);if(!candidates.some(x=>x.id===selectedId))selectedId=candidates[0]?.id||"";const chosen=candidates.find(x=>x.id===selectedId)||candidates[0],ad=chosen?adDraftFor(chosen):null,review=chosen?reviewPowerMaterial(p,chosen):null,top=volumeRows(p)[0];$("#pageSub").textContent=`${p.name} · ${month}월 실행 → ${nextMonth()}월 준비`;
  const candidateHtml=candidates.map(c=>`<button class="candidate${c.id===selectedId?" on":""}" data-candidate="${esc(c.id)}"><div class="candidate-top"><span class="candidate-title">${esc(c.title)}</span><span class="pill">${clen(c.title)}자</span></div><div class="candidate-meta">${esc(c.target_query||p.serpKw)} · 월 ${Number(c.search_demand||0).toLocaleString("ko-KR")}회 · 경쟁 ${esc(c.competition||"-")} · ${esc(c.source||"검색 근거")}</div></button>`).join("");
  const titleOk=Boolean(chosen)&&clen(chosen.title)>=TITLE.min&&clen(chosen.title)<=TITLE.max&&!review?.generationBlocking;
  $("#content").innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">POWER CONTENT WORKSPACE</div><h1>포스팅 소재를 먼저 정하고,<br>발행 원문으로 광고를 완성합니다</h1><p>파워콘텐츠는 파워링크 확장소재가 아닙니다. 블로그·카페 포스팅을 만든 뒤 제목·원문 발췌 설명·연결 URL·이미지·업체명·발행일을 등록합니다.</p></div><div class="source-card"><div class="source-title">근거 데이터</div><div class="source-row"><span>SearchAd 검색량</span><b>${esc(sourceDate(DATA.volume.asof))}</b></div><div class="source-row"><span>포스팅 제목 근거</span><b>${esc(sourceDate(DATA.titles.asof))}</b></div><div class="source-row"><span>시즌 캘린더</span><b>${esc(sourceDate(DATA.seasonal.asof))}</b></div><div class="source-row"><span>네이버 가이드</span><b>${esc(MATERIAL_SPEC.verifiedAt)}</b></div></div></section>
  <section class="metrics"><div class="metric"><div class="label">포스팅 소재</div><div class="value">${candidates.length}안</div><div class="sub">상품 범위·규격 검수</div></div><div class="metric"><div class="label">대표 검색어</div><div class="value">${esc(top?.kw||p.serpKw)}</div><div class="sub">월 ${Number(top?.total||0).toLocaleString("ko-KR")}회 · ${esc(top?.comp||"-")}</div></div><div class="metric"><div class="label">광고 제목</div><div class="value">${titleOk?"적합":"검토"}</div><div class="sub">공식 기준 ${TITLE.min}~${TITLE.max}자</div></div><div class="metric"><div class="label">광고 설명</div><div class="value">발행 후</div><div class="sub">원문 연속 ${POWER_SPEC.description.minLength}~${POWER_SPEC.description.maxLength}자 발췌</div></div></section>
  <div class="workspace"><div><section class="panel"><div class="panel-head"><div><h2>1. 블로그 포스팅 소재</h2><p>발행할 포스팅 제목을 고르면 광고 등록 초안에 반영됩니다.</p></div></div><div class="candidate-list">${candidateHtml||'<div class="empty">상품 범위와 규격을 통과한 후보가 없습니다.</div>'}</div></section></div>
  <aside>${ad?`<section class="panel"><div class="panel-head"><div><h2>2. 광고 소재 등록 초안</h2><p>포스팅 발행 후 빈 항목을 실제 자산으로 완성합니다.</p></div></div><div class="register-list"><div class="register-row"><b>제목</b><span>${esc(ad.title)} · ${clen(ad.title)}자</span></div><div class="register-row"><b>설명</b><span class="pending">발행 포스팅 원문에서 연속 ${POWER_SPEC.description.minLength}~${POWER_SPEC.description.maxLength}자 발췌</span></div><div class="register-row"><b>연결 URL</b><span class="pending">발행 포스트 URL</span></div><div class="register-row"><b>이미지</b><span class="pending">대표 이미지 · ${POWER_SPEC.image.minPixels}×${POWER_SPEC.image.minPixels}~${POWER_SPEC.image.maxPixels}×${POWER_SPEC.image.maxPixels}px</span></div><div class="register-row"><b>업체명</b><span>${esc(ad.businessName)}</span></div><div class="register-row"><b>발행일</b><span class="pending">콘텐츠 발행일</span></div><div class="register-row"><b>프로필</b><span>${esc(ad.profileImage)}</span></div></div></section>
  <section class="panel"><div class="panel-head"><h2>등록 전 확인</h2></div><ul class="check-list"><li><span class="check ${titleOk?"ok":"wait"}">${titleOk?"✓":"!"}</span><span>제목 ${TITLE.min}~${TITLE.max}자·상품 범위</span></li><li><span class="check wait">!</span><span>설명은 랜딩 원문 연속 문장만 사용</span></li><li><span class="check wait">!</span><span>이미지·URL·발행일 실제 자산 확인</span></li><li><span class="check wait">!</span><span>상품자료·약관·보험광고 심의</span></li></ul><a class="guide-link" href="${esc(MATERIAL_SPEC.powerContentGuideUrl)}" target="_blank" rel="noopener">네이버 파워콘텐츠 소재 가이드 ↗</a></section>`:""}</aside></div>`;renderNav()}
function csvCell(value){return `"${String(value??"").replace(/"/g,'""')}"`}
function exportCsv(){const p=product(),rows=[["상품","포스팅 소재","타깃 검색어","월검색량","경쟁도","광고 제목","제목 글자수","설명(발행 원문 연속 발췌)","연결 URL","대표 이미지 파일","업체명","콘텐츠 발행일","프로필 이미지 연동","검토 상태","근거 기준일"]];titleCandidates(p).forEach(c=>{const ad=adDraftFor(c),review=reviewPowerMaterial(p,c);rows.push([p.name,c.title,c.target_query||p.serpKw,c.search_demand||0,c.competition||"-",ad.title,clen(ad.title),ad.description,ad.landingUrl,ad.image,ad.businessName,ad.publishedAt,ad.profileImage,review.generationBlocking?review.statusLabel:"포스팅 발행·원문 발췌·보험광고 심의 필요",MATERIAL_SPEC.verifiedAt])});const blob=new Blob(["\ufeff"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${p.name}_파워콘텐츠_등록초안_${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast("파워콘텐츠 등록 초안을 내보냈습니다")}
document.addEventListener("click",e=>{const p=e.target.closest("[data-product]");if(p){currentKey=p.dataset.product;selectedId="";render();window.scrollTo({top:0})}const c=e.target.closest("[data-candidate]");if(c){selectedId=c.dataset.candidate;render()}});
$("#planMonth").innerHTML=PLANNING.optionMarkup(month);$("#planMonth").addEventListener("change",e=>{month=PLANNING.setMonth(e.target.value);selectedId="";render()});
$("#exportCsv").addEventListener("click",exportCsv);
$("#themeBtn").addEventListener("click",()=>{const root=document.documentElement,dark=root.getAttribute("data-theme")==="dark",next=dark?"light":"dark";root.setAttribute("data-theme",next);try{localStorage.setItem("mf_theme",next)}catch(_){}});
render();
Promise.all([
 fetch("data/volume.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(x=>{if(x)DATA.volume=x}).catch(()=>{}),
 fetch("data/seasonal.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(x=>{if(x)DATA.seasonal=x}).catch(()=>{}),
 fetch("data/adcopy/powercontent-title-opportunities.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(x=>{if(x)DATA.titles=x}).catch(()=>{})
]).then(render);
</script>
</body>
</html>
