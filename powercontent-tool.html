function editorialDraft(p,c,q,focus,issue,monthly){const ctx=CONTENT_CONTEXT[p.key]||CONTENT_CONTEXT.chronic,market=monthly?.market_patterns||{},crowded=(market.table_stakes||[]).slice(0,3).join("·")||"보험료·보장 나열",axis=c.message_axis||c.pattern||monthly?.variation?.primary_axis||"search_intent",season=issue?.tag||"";return[
  {heading:`${q} 검색 결과에서 질문부터 고르기`,keywords:[q,focus],body:`${josa(q,"을","를")} 검색하면 짧은 제목 안에 ${crowded} 같은 표현이 반복됩니다. 이런 표현은 시장에서 중요하게 다뤄지는 항목을 빠르게 파악하는 데는 유용하지만, 내 상황에 맞는 선택을 대신해 주지는 않습니다. 이번 기획은 그 반복을 그대로 옮기지 않고 ‘${focus}을 실제로 어떤 순간에 쓰게 되는가’라는 질문에서 시작합니다. 이번 달 선택한 메시지 축은 ${axis}이며, 제목·본문·이미지 모두 같은 질문을 이어갑니다.\n\n${p.name}을 볼 때 먼저 떠올릴 장면은 ${ctx.scene}입니다. 검색 결과에서 본 단어를 이 장면에 하나씩 대입해 보면 필요한 정보가 구체적으로 보입니다. 광고 문구의 인상보다 현재 내가 알고 싶은 상황, 이미 가진 보장, 새로 살펴볼 항목을 세 칸으로 나눠 적어 보세요. 이 메모가 뒤에서 상품설명서와 약관을 읽을 기준이 됩니다.`},
  {heading:`${focus}, 생활 장면과 약관 용어 연결하기`,keywords:uniq([focus,p.special[0],p.special[1]]),body:`${ctx.question}를 먼저 물어야 합니다. 비슷한 이름의 항목이라도 지급사유, 적용 시점, 한도, 보장하지 않는 경우가 다를 수 있습니다. 생활에서 쓰는 표현과 약관의 정의가 같은 뜻인지 문장 단위로 연결하고, 이해가 모호한 단어는 임의로 넓혀 해석하지 않습니다.\n\n이 상품에서 중요한 비교는 ${ctx.compare}입니다. ${p.special.slice(0,3).join("·")}을 한 줄에 나열하는 대신 각 항목 옆에 ‘어떤 상황’, ‘언제부터’, ‘어떤 조건’, ‘무엇이 제외되는가’를 적습니다. 실제 금액이나 지급 사례는 승인된 최신 자료가 있을 때만 넣고, 초안 단계에서는 확인 질문으로 남겨 과장된 일반론을 피합니다.`},
  {heading:"보험료 계산 전에 조건을 같은 줄에 맞추기",keywords:["보험료",q],body:`보험료 숫자만 먼저 비교하면 선택한 항목과 기간이 다른 결과를 같은 상품처럼 볼 수 있습니다. ${ctx.decision}부터 시작하고, 가입 대상·보험기간·납입기간·갱신 여부·선택 항목을 같은 순서로 놓습니다. 그다음 동일한 조건으로 계산한 결과인지 살펴봐야 숫자의 차이를 설명할 수 있습니다.\n\n검색광고에서 자주 보이는 간편함이나 혜택 표현은 클릭을 돕는 정보일 뿐 최종 판단 기준은 아닙니다. 계산 화면에서 입력한 값, 결과 화면에 남은 선택 항목, 최종 청약 화면의 내용을 차례로 대조하세요. 조건이 달라졌다면 보험료 차이만 기록하지 말고 무엇이 바뀌었는지도 함께 남겨야 다음 비교에서 같은 질문을 반복하지 않습니다.`},
  {heading:season?`${season}에만 달라지는 질문`:`SERP에서 덜 다룬 조건 펼쳐보기`,keywords:uniq([season,focus,"제외 조건"]).filter(Boolean),body:season?`${season}은 선택 월의 실제 이벤트 캘린더와 일치할 때만 이 원고에 들어옵니다. 시즌 이름을 붙이는 데서 끝내지 않고 ${ctx.scene} 가운데 이번 일정과 직접 맞닿는 장면을 고릅니다. 일정 전후로 달라지는 기간·장소·활동이 있다면 상품의 적용 조건과 같은지 살펴보고, 관련이 약하면 시즌 문구를 과감히 빼는 것이 낫습니다.\n\n지난해 같은 시즌 원고를 그대로 복사하지 않습니다. 올해 SERP에서 반복된 ${crowded}을 기준선으로 삼되, 이번에는 ${focus}의 실제 적용 조건과 독자의 다음 행동을 중심으로 변주합니다. 경쟁사 문구·프로모션 수치를 옮기지 않고, 새로 등장한 소구와 사라진 소구를 다음 월 기획에서 다시 비교할 수 있도록 질문과 사용 근거를 남깁니다.`:`이번 달 SERP에서 ${crowded}은 이미 여러 번 쓰였습니다. 따라서 같은 보장 나열을 한 번 더 만드는 대신 ${focus}의 적용 조건, ${p.special[1]}과의 차이, 설계 화면에서 확인할 위치를 풀어냅니다. 차별화는 낯선 수식어가 아니라 검색자가 다음 단계에서 실제로 해야 할 일을 더 선명하게 보여 주는 데서 만듭니다.\n\n새 소구는 상품 마스터 안의 항목인지 먼저 거르고, 실제 검색 수요와 연결되는지 확인합니다. 경쟁사가 쓰지 않았다는 이유만으로 무관한 담보를 끼워 넣지 않으며, 다른 상품이나 사업부 키워드도 제외합니다. 이 원칙을 지켜야 파워콘텐츠와 검색광고가 같은 상품 질문을 공유하면서도 서로의 검색 의도를 빼앗지 않습니다.`},

function introFor(p,c){const q=c.target_query||p.serpKw,a=p.special[0],b=p.special[1];const options=[`${josa(q,"을","를")} 알아보는 분을 위해 ${a}·${b} 등 가입 전에 확인할 항목과 비교 순서를 정리했습니다. 실제 보장 내용과 제외 조건은 상품설명서와 약관을 기준으로 확인해 주세요.`,`${q} 가입 전에 살펴볼 기준을 정리했습니다. ${a}·${b} 관련 조건과 보험료 확인 순서, 놓치기 쉬운 제외 사항을 함께 짚고 실제 내용은 상품설명서와 약관에서 확인합니다.`];let text=options.find(x=>clen(x)>=POWER_SPEC.description.minLength&&clen(x)<=POWER_SPEC.description.maxLength)||options[1];if(clen(text)<POWER_SPEC.description.minLength)text+=" 가입 전 필요한 내용을 차근차근 확인해 보세요.";if(clen(text)>POWER_SPEC.description.maxLength)text=[...text].slice(0,POWER_SPEC.description.maxLength-1).join("").replace(/[ ,·]+$/g,"")+".";return HUMANIZE.light(text)}
