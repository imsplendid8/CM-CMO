<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="CM 다이렉트 마케팅 참고 논문 아카이브 — 월간 자동 적립(네이버 학술)">
<title>Modooflow · 논문 아카이브</title>
<style>
@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:url('fonts/PretendardVariable.woff2') format('woff2-variations');}
:root{
  --brand:#5b6ee1; --brand-600:#3f52c9; --brand-50:#e9ecfb; --brand-tint:#f2f4fd;
  --grad:linear-gradient(135deg,#7186f0 0%,#5b6ee1 100%);
  --ink:#0f1729; --ink-2:#4a5163; --muted:#8b93a3; --faint:#cdd2db;
  --bg:#f7f8fa; --surface:#ffffff; --surface-2:#f4f6f8; --line:#e8ebef; --line-2:#eef1f4;
  --good:#1f9d6b; --good-bg:#e4f6ee; --mid:#c47f12; --mid-bg:#fbf1de; --bad:#d64545; --bad-bg:#fbe7e4;
  --r:14px; --r-sm:10px; --sh:0 1px 2px rgba(15,23,41,.04),0 2px 6px rgba(15,23,41,.05); --sh-lg:0 12px 30px rgba(15,23,41,.10);
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:'Pretendard Variable','Pretendard','Noto Sans KR','Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){:root{--ink:#eef1f6;--ink-2:#b7bdc9;--muted:#7f8697;--faint:#4a4f60;--bg:#0e1016;--surface:#171a21;--surface-2:#1d212a;--line:#262b35;--line-2:#20242d;--brand-50:#1a2050;--brand-tint:#141830;--good-bg:#122c20;--mid-bg:#2e2410;--bad-bg:#331817;--sh:0 1px 2px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.5);--sh-lg:0 14px 34px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{--ink:#eef1f6;--ink-2:#b7bdc9;--muted:#7f8697;--faint:#4a4f60;--bg:#0e1016;--surface:#171a21;--surface-2:#1d212a;--line:#262b35;--line-2:#20242d;--brand-50:#1a2050;--brand-tint:#141830;--good-bg:#122c20;--mid-bg:#2e2410;--bad-bg:#331817;--sh:0 1px 2px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.5);--sh-lg:0 14px 34px rgba(0,0,0,.6);}
:root[data-theme="light"]{--ink:#0f1729;--ink-2:#4a5163;--muted:#8b93a3;--faint:#cdd2db;--bg:#f7f8fa;--surface:#ffffff;--surface-2:#f4f6f8;--line:#e8ebef;--line-2:#eef1f4;--brand-50:#e9ecfb;--brand-tint:#f2f4fd;--good-bg:#e4f6ee;--mid-bg:#fbf1de;--bad-bg:#fbe7e4;--sh:0 1px 2px rgba(15,23,41,.04),0 2px 6px rgba(15,23,41,.05);--sh-lg:0 12px 30px rgba(15,23,41,.10);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.011em;word-break:keep-all;}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);}
.brand-logo{width:32px;height:32px;border-radius:9px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 4px 12px rgba(91,110,225,.35);flex:0 0 auto;}
.topbar #pt{font-size:16px;font-weight:800;letter-spacing:-.02em;} .topbar #pts{font-size:11.5px;color:var(--muted);}
.crumb{font-size:12px;color:var(--muted);text-decoration:none;font-weight:700;}.crumb:hover{color:var(--brand-600);}
.tr{margin-left:auto;display:flex;align-items:center;gap:8px;}
.search{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;}
.search input{border:none;background:none;font-family:inherit;font-size:12.5px;color:var(--ink);outline:none;width:190px;}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:14px;}
.content{padding:20px 24px 60px;max-width:960px;width:100%;margin:0 auto;}
.banner{background:var(--mid-bg);border:1px solid color-mix(in srgb,var(--mid) 30%,var(--line));border-radius:var(--r-sm);padding:11px 15px;font-size:12px;color:var(--ink-2);margin-bottom:16px;line-height:1.6;}
.banner b{color:var(--mid);} .banner a{color:var(--brand-600);font-weight:800;}
.intro{font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--r-sm);padding:11px 15px;margin-bottom:16px;box-shadow:var(--sh);}
.intro b{color:var(--brand-600);}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.chip{padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:700;cursor:pointer;transition:.14s;}
.chip:hover{border-color:var(--brand);color:var(--brand-600);}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.chip .n{font-family:var(--mono);font-size:10.5px;opacity:.8;margin-left:5px;}
.grp-h{font-size:12px;font-weight:800;color:var(--brand-600);margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
.grp-h .n{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:700;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);margin-bottom:11px;}
.card-h{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.card a.t{font-size:14px;font-weight:800;color:var(--ink);text-decoration:none;line-height:1.45;flex:1;min-width:200px;}
.card a.t:hover{color:var(--brand-600);text-decoration:underline;}
.badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap;}
.badge.date{background:var(--brand-50);color:var(--brand-600);font-family:var(--mono);}
.badge.auto{background:var(--good-bg);color:var(--good);}
.badge.manual{background:color-mix(in srgb,#e0a020 20%,transparent);color:#a0690f;}
.badge.new{background:var(--brand);color:#fff;}
.srcbar{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-bottom:14px;line-height:1.8;}
.srcbar b{color:var(--ink-2);} .srcbar a{color:var(--brand-600);font-weight:700;text-decoration:none;} .srcbar a:hover{text-decoration:underline;}
.card .desc{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-top:8px;}
.card .note{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:7px;padding-top:7px;border-top:1px solid var(--line-2);}
.card .note b{color:var(--ink-2);}
.card .lk{font-size:11px;color:var(--brand-600);font-weight:700;text-decoration:none;font-family:var(--mono);}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px;}
.foot{font-size:10.5px;color:var(--muted);margin-top:24px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px;}
.foot a{color:var(--brand-600);text-decoration:none;font-weight:700;}
</style>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("mf_theme")||"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
</head>
<body>
<main class="main">
  <header class="topbar">
    <div class="brand-logo">📚</div>
    <div><a class="crumb" href="index.html">Modooflow ›</a><div id="pt">논문 아카이브</div></div>
    <div class="tr">
      <div class="search">🔎<input id="q" placeholder="제목·요약 검색" autocomplete="off"></div>
      <button class="icon-btn" id="themeBtn" title="테마">◐</button>
    </div>
  </header>
  <div class="content" id="content"><div class="empty">불러오는 중…</div></div>
</main>
<script>
"use strict";
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let DATA={topics:[],papers:[]}, curTopic="__all", curQ="";

function host(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch(_){return "원문";}}

function render(){
  const c=$("#content");
  if(!DATA.papers.length){
    const fileMode=location.protocol==="file:";
    c.innerHTML=`<div class="banner">${fileMode
      ?`⚠️ <b>로컬 파일로 열었습니다.</b> 이렇게 열면 논문 데이터(<code>data/papers.json</code>)가 로드되지 않습니다. 배포 주소로 여세요 → <a href="https://imsplendid8.github.io/CM-CMO/papers-tool.html" target="_blank" rel="noopener">imsplendid8.github.io/CM-CMO/papers-tool.html</a>`
      :`아직 적립된 논문이 없습니다. 매월 1일 자동 적립됩니다.`}</div>`;
    return;
  }
  const q=curQ.trim().toLowerCase();
  const SRC=DATA.papers.filter(p=>p.kind==="source");           // 자료원(학술 DB) — 주제 그룹 아님
  const PAPERS=DATA.papers.filter(p=>p.kind!=="source");        // 실제 논문(주제별 그룹 대상)
  const match=p=>(curTopic==="__all"||p.topic===curTopic)&&(!q||(p.title+p.desc+p.note).toLowerCase().includes(q));
  const rows=PAPERS.filter(match);
  // 주제 칩(제공자 무관 · 주제 기준)
  const chip=(k,label,n)=>`<button class="chip${curTopic===k?" on":""}" data-topic="${esc(k)}">${esc(label)}<span class="n">${n}</span></button>`;
  let chips=chip("__all","전체",PAPERS.length);
  DATA.topics.forEach(t=>{chips+=chip(t,t,PAPERS.filter(p=>p.topic===t).length);});
  const srcBar=SRC.length?`<div class="srcbar">🔎 <b>학술 검색 DB(자료원)</b> · ${SRC.map(s=>`<a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.title)} ↗</a>`).join(" · ")}<br><span style="color:var(--muted)">주제별 원문은 각 DB에서 직접 검색 — 특정 논문이 아니라 검색처라 주제 그룹과 분리했습니다.</span></div>`:"";
  // 주제별 그룹
  let body="";
  const groups=curTopic==="__all"?DATA.topics:[curTopic];
  const thisMonth=new Date().toISOString().slice(0,7);
  groups.forEach(t=>{
    const items=rows.filter(p=>p.topic===t).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));  // 최신 적립 우선
    if(!items.length)return;
    body+=`<div class="grp-h">${esc(t)}<span class="n">${items.length}편</span></div>`;
    items.forEach(p=>{
      body+=`<div class="card"><div class="card-h">
        <a class="t" href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>
        ${p.date&&p.date.slice(0,7)===thisMonth?`<span class="badge new">이번 달 신규</span>`:""}
        ${p.date?`<span class="badge date">${esc(p.date)}</span>`:""}
        ${p.auto?`<span class="badge auto" title="네이버 학술 자동 적립">🤖 자동적립</span>`:`<span class="badge manual" title="담당자가 직접 추가">📌 담당자 제공</span>`}</div>
        ${p.desc?`<div class="desc">${esc(p.desc)}</div>`:""}
        ${p.note?`<div class="note"><b>담당자 참고</b> · ${esc(p.note)}</div>`:""}
        <div style="margin-top:7px"><a class="lk" href="${esc(p.link)}" target="_blank" rel="noopener">🔗 ${esc(host(p.link))} ↗</a></div>
      </div>`;
    });
  });
  $("#pt").textContent="논문 아카이브";
  const asof=DATA.updated?` · 갱신 ${esc(DATA.updated)}`:"";
  c.innerHTML=`
    <div class="intro"><b>CM 다이렉트 마케팅 참고 논문</b> — 매월 1일 <b>네이버 학술(전문자료)</b> 검색으로 신규 논문을 자동 적립합니다(GitHub Actions). 원문은 링크만, 요약은 공개 서지·초록 기반. <b>주제별 그룹</b>(제공자 무관 · 📌담당자 제공/🤖자동적립은 배지로 구분). 총 <b>${PAPERS.length}편</b>${asof}.</div>
    ${srcBar}
    <div class="chips">${chips}</div>
    ${body||`<div class="empty">검색 결과 없음 — 다른 키워드나 주제를 선택하세요.</div>`}
    <div class="foot">데이터: <code>data/papers.json</code> ← <code>docs/논문-아카이브.md</code>(정본, GitHub에서 렌더) · 수집: 네이버 학술 검색 · 요약은 자체 정리이며 원문 저작권은 각 발행처에 있습니다. · <a href="index.html">← 통합 콘솔</a></div>`;
}

document.addEventListener("click",e=>{
  const ch=e.target.closest("[data-topic]");
  if(ch){curTopic=ch.dataset.topic;render();window.scrollTo({top:0});}
});
$("#q").addEventListener("input",e=>{curQ=e.target.value;render();});
$("#themeBtn").addEventListener("click",()=>{const c=document.documentElement.getAttribute("data-theme");const d=c?c==="dark":matchMedia("(prefers-color-scheme:dark)").matches;document.documentElement.setAttribute("data-theme",d?"light":"dark");try{localStorage.setItem("mf_theme",d?"light":"dark")}catch(_){};});

fetch("data/papers.json").then(r=>r.json()).then(d=>{DATA=d;render();}).catch(()=>render());
render();
</script>
</body>
</html>
