<html lang="ko">
<head>

<meta name="referrer" content="no-referrer">
<meta name="description" content="검색광고 문구 소재 제작 — 네이버 파워링크 규격(제목15·설명45) 강제 + 금지표현 린트 + 광고심의 전제">
<title>Modoo · 검색광고 문구 소재</title>
<link rel="icon" type="image/svg+xml" href="icons/modoo-mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/modoo-32.png">
<link rel="apple-touch-icon" href="icons/modoo-180.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --brand:#e8553d; --brand-600:#c53d28; --brand-50:#fdeae5; --brand-tint:#fef4f1;
  --grad:linear-gradient(135deg,#f0714f 0%,#e8553d 100%);
  --ink:#241a17; --ink-2:#584c47; --muted:#948a84; --faint:#d4cbc6;
  --bg:#f8f5f3; --surface:#fff; --surface-2:#faf7f5; --line:#ece4e0; --line-2:#f4efec;
  --good:#2b8a6b; --good-bg:#e3f5ee; --bad:#c0392b; --bad-bg:#fbe7e4; --warn:#c47f12; --warn-bg:#fbf1de;
  --r:14px; --r-sm:10px; --sh:0 1px 2px rgba(40,20,10,.05),0 6px 20px rgba(40,20,10,.06); --sh-lg:0 12px 40px rgba(40,20,10,.12);
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:'Pretendard','Noto Sans KR','Nanum Gothic','Apple SD Gothic Neo',-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --ink:#f3ece9;--ink-2:#cabfb9;--muted:#968a84;--faint:#4d453f;--bg:#160f0d;--surface:#1e1613;--surface-2:#241b17;--line:#332721;--line-2:#28201b;
  --brand:#f0714f;--brand-600:#f4906f;--brand-50:#2c1710;--brand-tint:#20130e;--good-bg:#0f2c22;--bad-bg:#331817;--warn-bg:#33270f;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.4);--sh-lg:0 12px 40px rgba(0,0,0,.55);}}
:root[data-theme="dark"]{--ink:#f3ece9;--ink-2:#cabfb9;--muted:#968a84;--faint:#4d453f;--bg:#160f0d;--surface:#1e1613;--surface-2:#241b17;--line:#332721;--line-2:#28201b;--brand:#f0714f;--brand-600:#f4906f;--brand-50:#2c1710;--brand-tint:#20130e;--good-bg:#0f2c22;--bad-bg:#331817;--warn-bg:#33270f;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.4);--sh-lg:0 12px 40px rgba(0,0,0,.55);}
:root[data-theme="light"]{--ink:#241a17;--ink-2:#584c47;--muted:#948a84;--faint:#d4cbc6;--bg:#f8f5f3;--surface:#fff;--surface-2:#faf7f5;--line:#ece4e0;--line-2:#f4efec;--brand:#e8553d;--brand-600:#c53d28;--brand-50:#fdeae5;--brand-tint:#fef4f1;--good-bg:#e3f5ee;--bad-bg:#fbe7e4;--warn-bg:#fbf1de;--sh:0 1px 2px rgba(40,20,10,.05),0 6px 20px rgba(40,20,10,.06);--sh-lg:0 12px 40px rgba(40,20,10,.12);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;word-break:keep-all;}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
@media(max-width:820px){.app{grid-template-columns:1fr;}.sidebar{position:static!important;height:auto!important;}}
.sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sb-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--line);}
.brand-logo{width:34px;height:34px;border-radius:9px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;box-shadow:0 6px 16px rgba(232,85,61,.4);flex:0 0 auto;}
.bn{font-size:14px;font-weight:800;letter-spacing:-.02em;} .sb-brand small{display:block;font-size:9.5px;color:var(--muted);font-weight:600;margin-top:1px;}
.sb-nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:2px;}
.sb-cap{font-size:9.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:12px 8px 5px;}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;text-align:left;width:100%;transition:.14s;}
.sb-item:hover{background:var(--surface-2);color:var(--ink);} .sb-item.on{background:var(--brand-50);color:var(--brand-600);}
.sb-foot{padding:12px 14px;border-top:1px solid var(--line);font-size:9.5px;color:var(--muted);line-height:1.6;}
.sb-foot a{color:var(--brand-600);text-decoration:none;font-weight:700;}
.main{min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);}
.topbar #pt{font-size:16px;font-weight:800;letter-spacing:-.02em;} .topbar #pts{font-size:11.5px;color:var(--muted);}
.tr{margin-left:auto;display:flex;align-items:center;gap:8px;}
.month-picker{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:var(--muted);}
.month-picker select{font-family:inherit;font-size:12px;font-weight:800;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 28px 7px 10px;cursor:pointer;}
@media(max-width:720px){.month-picker span{display:none;}}
.btn{padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;}
.btn:hover{border-color:var(--brand);color:var(--brand-600);} .btn.sm{padding:5px 9px;font-size:11px;}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:14px;}
.crumb{font-size:12px;color:var(--muted);text-decoration:none;font-weight:700;} .crumb:hover{color:var(--brand-600);}
.content{padding:20px 24px 60px;max-width:1080px;}
.banner{background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 30%,var(--line));border-radius:var(--r);padding:11px 15px;font-size:11.5px;color:var(--ink-2);margin-bottom:16px;line-height:1.6;}
/* 추천 소재(근거 기반) 카드 — event_engine 산출물 병합 */
.rc-wrap{display:flex;flex-direction:column;gap:11px;}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);}
.rc-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px;}
.rc-st{font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);}
.rc-st.active{background:var(--brand-50);color:var(--brand-600);}
.rc-pr{font-size:13px;font-weight:800;letter-spacing:-.02em;}
.rc-ev{font-size:11px;color:var(--muted);font-weight:700;}
.rc-cf{margin-left:auto;font-size:10px;font-family:var(--mono);color:var(--muted);}
.rc-l{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line-2);}
.rc-l .k{flex:0 0 38px;font-size:10.5px;color:var(--muted);font-weight:700;}
.rc-l .v{flex:1;min-width:0;font-size:13px;color:var(--ink);line-height:1.5;}
.rc-f{margin-top:8px;font-size:10.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:7px 10px;line-height:1.6;}
.banner b{color:var(--warn);}
.specbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.spec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 13px;font-size:11.5px;color:var(--ink-2);box-shadow:var(--sh);}
.spec b{color:var(--brand-600);font-family:var(--mono);}
.sec-lbl{font-size:12px;font-weight:800;color:var(--ink-2);letter-spacing:.02em;margin:22px 0 9px;}
.sec-lbl b{color:var(--brand-600);}
.sscount{font-size:10.5px;font-weight:800;color:var(--bad);background:var(--bad-bg);padding:1px 7px;border-radius:99px;}
.xbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.xbtn{background:var(--grad);color:#fff;border:none;font-weight:800;box-shadow:0 6px 16px rgba(232,85,61,.3);}
.xbtn:hover{color:#fff;filter:brightness(1.05);}
.btn:disabled{opacity:.48;cursor:not-allowed;filter:none!important;}
.tpl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:var(--surface-2);font-size:11.5px;color:var(--muted);}
.tpl input{max-width:230px;font:inherit;color:var(--ink-2);}.tpl b{color:var(--ink-2);}.tpl .ok{color:var(--ok);font-weight:800}.tpl .no{color:var(--bad);font-weight:800}
.xnote{font-size:11px;color:var(--muted);}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--sh);}
table.sheet{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--surface);}
table.sheet th{background:var(--surface-2);color:var(--ink-2);font-size:10.5px;font-weight:800;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.sheet th small{color:var(--muted);font-weight:700;}
table.sheet td{padding:7px 12px;border-bottom:1px solid var(--line-2);color:var(--ink);vertical-align:middle;}
table.sheet tr:last-child td{border-bottom:none;}
table.sheet .c{text-align:center;width:1%;white-space:nowrap;} table.sheet .mono{font-family:var(--mono);font-weight:800;color:var(--ink-2);}
table.sheet .muted{color:var(--muted);}
table.sheet tr.ss td{background:var(--bad-bg);color:var(--bad);} table.sheet tr.ss .mono{color:var(--bad);}
.ssb{display:inline-block;margin-left:7px;font-size:9.5px;font-weight:800;color:#fff;background:var(--bad);padding:1px 6px;border-radius:99px;vertical-align:middle;}
table.sheet .cp{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
table.sheet .cp:hover{border-color:var(--brand);color:var(--brand-600);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:720px){.grid{grid-template-columns:1fr;}}
.cand{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);display:flex;align-items:flex-start;gap:10px;}
.cand .tx{flex:1;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.5;}
.cand .len{font-family:var(--mono);font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap;background:var(--good-bg);color:var(--good);}
.cand .len.warn{background:var(--warn-bg);color:var(--warn);}
.cand .cp{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:7px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
.cand .cp:hover{border-color:var(--brand);color:var(--brand-600);}
.cand.flag{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));}
.flagmsg{font-size:10.5px;color:var(--bad);font-weight:700;margin-top:4px;}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-top:8px;}
.editor .row{margin-bottom:14px;}
.editor label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:var(--ink);}
.editor label span{font-weight:600;color:var(--muted);}
.editor input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:14px;}
.editor input:focus{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-50);}
.meta{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:11.5px;}
.meta .len{font-family:var(--mono);font-weight:800;}
.meta .ok{color:var(--good);} .meta .no{color:var(--bad);}
.lint{font-size:11px;color:var(--bad);font-weight:700;}
.ev{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--r);padding:13px 15px;margin-bottom:16px;box-shadow:var(--sh);}
.ev-row{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line-2);}
.ev-row:first-child{border-top:0;padding-top:0;}
.ev-lb{flex:0 0 120px;font-size:11px;font-weight:800;white-space:nowrap;}
.ev-lb.news{color:#0a7c3e;} .ev-lb.comp{color:var(--bad);} .ev-lb.ours{color:var(--good);} .ev-lb.vol{color:var(--brand-600);}
.volkw{display:inline-block;margin:0 6px 5px 0;font-size:11.5px;}
.volkw b{color:var(--ink);font-weight:800;} .volkw i{font-style:normal;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:99px;vertical-align:middle;}
.cbadge.hi{background:var(--bad-bg);color:var(--bad);} .cbadge.mid{background:var(--warn-bg);color:var(--warn);} .cbadge.lo{background:var(--good-bg);color:var(--good);}
.wx-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;} @media(max-width:720px){.wx-wrap{grid-template-columns:1fr;}}
.wx-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);}
.wx-card.on{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-bg);}
.wx-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;}
.wx-k{font-size:13px;font-weight:800;} .wx-live{font-size:10px;font-weight:800;color:#fff;background:var(--bad);padding:1px 8px;border-radius:99px;}
.wx-why{font-size:10.5px;color:var(--muted);font-weight:600;flex-basis:100%;}
.wx-len{font-family:var(--mono);font-size:10.5px;font-weight:800;color:var(--good);white-space:nowrap;} .wx-len.over{color:var(--bad);}
.ev-tx{flex:1;font-size:11.5px;color:var(--ink-2);line-height:1.55;} .ev-tx b{color:var(--ink);font-weight:800;}
.ev-links{margin-top:8px;font-size:11px;} .ev-links a{color:var(--brand-600);font-weight:700;text-decoration:none;} .ev-links a:hover{text-decoration:underline;}
.issue{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:14px;}
.issue-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
.issue-h .tag{font-size:13px;font-weight:800;color:var(--ink);}
.issue-h .prox{font-size:10.5px;font-weight:800;background:var(--brand);color:#fff;padding:2px 8px;border-radius:99px;}
.issue-h .mon{font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-left:auto;}
.issue-why{font-size:11.5px;color:var(--ink-2);line-height:1.5;margin-bottom:10px;}
.note{background:var(--surface);border:1px dashed var(--brand);border-radius:var(--r);padding:13px 15px;font-size:12px;color:var(--ink-2);line-height:1.7;margin-top:16px;box-shadow:var(--sh);}
.note b{color:var(--brand-600);}
.serp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:16px;}
.serp-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh);}
.serp-card h3{font-size:13px;margin-bottom:8px;}.serp-card p{font-size:11.5px;color:var(--ink-2);line-height:1.65;}
.serp-ad{padding:8px 0;border-top:1px solid var(--line-2);}.serp-ad:first-of-type{border-top:0;}.serp-ad b{font-size:11px}.serp-ad small{display:block;color:var(--muted);margin-top:2px;}
.source-pill{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--brand-50);color:var(--brand-600);margin-left:5px;}
.stale{color:var(--bad);font-weight:800}.fresh{color:var(--good);font-weight:800}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sb-cap.top{padding-top:6px;}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
@media(max-width:820px){.kpi-row{grid-template-columns:1fr 1fr;}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh);}
.kpi .n{font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.kpi .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:6px;}
/* 주차별 캘린더 */
.wk-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;}
.wk-card.now{border-color:var(--brand);}
.wk-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 15px;background:var(--surface-2);border-bottom:1px solid var(--line-2);}
.wk-date{font-family:var(--mono);font-size:13px;font-weight:800;}
.wk-prox{font-size:10.5px;font-weight:800;background:var(--brand);color:#fff;padding:2px 9px;border-radius:99px;}
.wk-prox.soon{background:var(--brand-50);color:var(--brand-600);}
.wk-mon{font-size:11px;color:var(--muted);font-weight:700;margin-left:auto;}
.wk-b{padding:13px 15px;}
.wk-focus-lb{font-size:10px;font-weight:800;color:var(--brand-600);letter-spacing:.04em;margin-bottom:4px;}
.wk-focus-t{font-size:13.5px;font-weight:800;margin-bottom:9px;}
.wk-vol{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:700;color:var(--brand-600);background:var(--brand-50);padding:1px 8px;border-radius:99px;vertical-align:middle;}
.wk-copy{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;font-size:12.5px;}
.wk-copy .k{flex:0 0 34px;font-size:10.5px;font-weight:800;color:var(--muted);padding-top:2px;}
.wk-copy .v{flex:1;color:var(--ink);}
.wk-copy .cp{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.wk-copy .cp:hover{border-color:var(--brand);color:var(--brand-600);}
.wk-comp{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--ink-2);line-height:1.6;}
.wk-comp b{color:var(--bad);} .wk-comp .lk{color:var(--brand-600);font-weight:800;cursor:pointer;}
.wk-other{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.wk-chip{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:2px 9px;}
/* 경쟁사 브랜드검색 */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.bcard{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden;}
.bcard-h{font-size:12.5px;font-weight:800;color:var(--ink);padding:9px 12px;border-bottom:1px solid var(--line);}

/* 경쟁사 관측에서는 구체 담보·상황·행동 유도 구조를 차용하고, 브랜드·수치·할인은 복사하지 않는다. */
function serpIdeas(p){
  const a=AD_ANALYSIS[p.key]||{}, common=a.common_soju||[];
  const overlaps=x=>common.some(c=>x.includes(c)||c.includes(x));
  const own=(p.covers||[]).filter(x=>!overlaps(x));
  const angle=own[0]||p.short.find(x=>!overlaps(x))||"가입 전 보장 확인";
  const demand=(((typeof topVol==="function"?topVol(p.key,3):[])[0])||{}).kw||al(p);
  const hasEvidence=p.cat!=="사이트"&&Boolean((a.observed_ads||[]).length||a.n);
  const title=(preferred,fallback)=>clen(preferred)<=SPEC.titleMax?preferred:fallback;
  const agent=SERP_AGENT[p.key]||{},generated=agent.candidates||[];
  const selectedAngle=agent.selected_angle||angle,selectedDemand=agent.keyword||demand;
  const blocked=p.blocked||[];
  const inScope=x=>!blocked.some(term=>(x.title+x.desc).replace(/\s/g,"").includes(term.replace(/\s/g,"")));
  const usefulGenerated=generated.filter(x=>!/(보장 여부|확인해 보세요|보장 범위와 제외 조건|필요한 보장)/.test(`${x.title} ${x.description}`));
  const observedBrands=(a.observed_ads||[]).map(x=>x.brand).filter(Boolean).slice(0,2).join("·")||"경쟁사";
  const lastCover=p.covers[p.covers.length-1]||angle;
  const raw=usefulGenerated.length?usefulGenerated.map(x=>({strategy:x.strategy,title:x.title,desc:x.description,
    why:x.pattern_note||`${observedBrands} 관측 문구의 구조를 차용 · 상품 내용 확인 필요`})):hasEvidence?[
    {strategy:"상황·담보",title:title(`${angle} 특약으로 대비`,`${al(p)} 미리 대비`),desc:`갑작스러운 ${angle} 걱정, ${p.name} 관련 특약으로 미리 대비하세요.`,why:`${observedBrands}의 구체 담보+상황 구조 차용 · 수치·할인 제외`},
    {strategy:"간편 전환",title:title(`${al(p)} 간편 가입`,`${al(p)} 바로 가입`),desc:`전화 상담 없이 ${al(p)} 내 보험료를 계산하고 온라인으로 가입하세요.`,why:`경쟁사 CTA 구조를 활용하되 우리 채널의 온라인 흐름으로 전환`},
    {strategy:"담보 묶음",title:title(`${al(p)} 필요한 특약`,`${al(p)} 특약 안내`),desc:`${angle}부터 ${lastCover}까지, 필요한 특약을 한 번에 준비하세요.`,why:`‘${demand}’ 검색 수요와 경쟁사 핵심 소구를 상품 담보 맥락으로 재구성`},
  ]:[];
  const candidates=raw.map(x=>({...x,title:dw(HUMANIZE.light(x.title)),desc:dw(HUMANIZE.light(x.desc))}))
    .filter(x=>clen(x.title)>=4&&clen(x.title)<=SPEC.titleMax&&clen(x.desc)>=SPEC.descMin&&clen(x.desc)<=SPEC.descMax&&!lintBan(x.title+x.desc).length)
    .filter(inScope)
    .filter((x,i,arr)=>arr.findIndex(y=>y.title===x.title&&y.desc===x.desc)===i);
  const titles=candidates.map(x=>({tx:x.title,len:clen(x.title),ban:[],serp:true}));
  const descs=candidates.map(x=>({tx:x.desc,len:clen(x.desc),ban:[],serp:true}));
  return {titles,descs,candidates,angle:selectedAngle,demand:selectedDemand,common,observed:a.observed_ads||[],latest:a.latest_date||AD_META.asof||""};
}

const REVIEW_STATUS="자동 위험표현 없음 · 상품 근거·사람 심의 필요";
const STRATEGIES=[
  {key:"brand",label:"브랜드·공식"},
  {key:"coverage",label:"보장·상품 소구"},
  {key:"situation",label:"문제·상황"},

function validateNaverRow(r){
  const errors=[];
  if(!r.title||clen(r.title)>SPEC.titleMax)errors.push("제목 규격");
  if(!r.description||clen(r.description)<SPEC.descMin||clen(r.description)>SPEC.descMax)errors.push("설명 규격");
  if(r.extraTitle&&clen(r.extraTitle)>SPEC.additionalTitleMax)errors.push("추가제목 규격");
  if(r.additionalDescription&&clen(r.additionalDescription)>SPEC.additionalDescMax)errors.push("추가설명 규격");
  if(r.promo&&clen(r.promo)>SPEC.promoMax)errors.push("홍보문구 규격");
  const sublinks=[r.sublink1,r.sublink2,r.sublink3,r.sublink4].filter(Boolean);
  if(sublinks.length<SPEC.subMinCount||sublinks.length>SPEC.subMaxCount)errors.push("서브링크 개수");
  if(new Set(sublinks).size!==sublinks.length)errors.push("서브링크 중복");
  sublinks.forEach((v,i)=>{if(clen(v)>SPEC.subMax)errors.push(`서브링크${i+1} 규격`);});
  const compliance=AD_REVIEW.reviewFields({title:r.title,description:r.description,extraTitle:r.extraTitle,additionalDescription:r.additionalDescription,promo:r.promo},{channel:"sa"});
  const blocking=[...new Set(compliance.findings.filter(f=>f.generationBlocking).map(f=>f.ruleId))];
  if(blocking.length)errors.push(`심의 사전검수:${blocking.join("/")}`);
  MATERIAL_SPEC.manualOnlyFields.forEach(key=>{if(r[key])errors.push(`${key} 자동 입력 금지`);});
  return errors;
}
function buildNaverRows(p,target=50){
  const s=buildSheet(p),safe=rows=>(rows||[]).filter(o=>!o.ban?.length),titles=safe(s.brand),descs=safe(s.desc),subt=safe(s.subt),additionalDescs=safe(s.additionalDesc),promos=safe(s.promo);
  const subs=uniq([...safe(s.sub).map(o=>o.tx),"보험료계산","보장내용","간편가입","가입조건"]).slice(0,SPEC.subMaxCount);
  if(!titles.length||!descs.length||!subt.length||!additionalDescs.length||!promos.length||subs.length<SPEC.subMinCount)return [];
  const rows=[],seen=new Set();
  const perStrategy=Math.floor(target/STRATEGIES.length),extra=target%STRATEGIES.length;
  STRATEGIES.forEach((strategy,si)=>{
    const need=perStrategy+(si<extra?1:0);let made=0;
    for(let combo=0;combo<5000&&made<need;combo++){
      const ti=combo%titles.length;
      const di=Math.floor(combo/titles.length)%descs.length;
      const ai=Math.floor(combo/(titles.length*descs.length))%subt.length;
      const adi=(combo+si)%additionalDescs.length;
      const pi=(combo+si)%promos.length;
      const linkStart=(combo+si*2)%subs.length;
      const links=Array.from({length:SPEC.subMaxCount},(_,j)=>subs[(linkStart+j)%subs.length]);
      const row={
        strategy:strategy.label,reviewStatus:REVIEW_STATUS,campaignId:"",
        campaignName:`CM_파워링크_${p.name}`,adGroupName:`${p.name} · ${strategy.label}`,
        title:titles[ti].tx,description:descs[di].tx,displayUrl:"",pcUrl:"",mobileUrl:"",
        extraTitle:subt[ai].tx,additionalDescription:additionalDescs[adi].tx,promo:promos[pi].tx,
        sublink1:links[0],sublink2:links[1],sublink3:links[2],sublink4:links[3],
        calculationUrl:"",powerLinkImageId:"",
        sublinkUrl1:"",sublinkUrl2:"",sublinkUrl3:"",sublinkUrl4:"",
        sublinkImageId1:"",sublinkImageId2:"",sublinkImageId3:"",sublinkImageId4:"",
      };
      const sig=[row.campaignName,row.adGroupName,row.title,row.description,row.extraTitle,row.additionalDescription,row.promo,...links].join("|");
      if(seen.has(sig)||validateNaverRow(row).length)continue;
      seen.add(sig);rows.push(row);made++;
    }
  });
  return rows;
}

};
const normHeader=s=>String(s).toLowerCase().replace(/^﻿/,"").replace(/[\s()[\]{}·._\-/]/g,"");
function parseDelimitedLine(line,delim){
  const out=[];let cur="",quoted=false;
  for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++;}else quoted=!quoted;}else if(ch===delim&&!quoted){out.push(cur.trim());cur="";}else cur+=ch;}
  out.push(cur.trim());return out;
}
async function readNaverTemplate(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(!["csv","tsv","txt"].includes(ext))throw new Error("공식 파일을 CSV 또는 TSV로 저장한 뒤 불러오세요");
  const text=await file.text(),first=(text.split(/\r?\n/).find(x=>x.trim())||"").replace(/^﻿/,"");
  const delim=first.includes("\t")?"\t":",";const headers=parseDelimitedLine(first,delim);
  const mapping=headers.map(h=>TEMPLATE_ALIASES[normHeader(h)]||null);
  const required=["campaignName","adGroupName","title","description"];
  const missing=required.filter(k=>!mapping.includes(k));
  if(missing.length)throw new Error(`필수 열 매핑 실패: ${missing.join(", ")}`);
  return {name:file.name,headers,mapping,delimiter:delim};
}

function renderReco(){
  $("#pt").textContent="추천 소재"; $("#pts").textContent=RECO.asof?`· 기준 ${RECO.asof}`:"";
  const recs=usableRecs(),ST={upcoming:"예정",emerging:"신흥",active:"진행"};
  const cards=recs.length?recs.map(r=>`
    <div class="rc">
      <div class="rc-h"><span class="rc-st ${esc(r.event_state)}">${esc(ST[r.event_state]||r.event_state)}</span>
        <span class="rc-pr">${esc(r.product_name)}</span><span class="rc-ev">${esc(r.event_name)}</span>
        <span class="rc-cf">추천도 ${Math.round(Number(r.confidence||0)*100)}%</span></div>
      <div class="rc-l"><span class="k">제목</span><span class="v">${esc(r.title)}</span></div>
      <div class="rc-l"><span class="k">설명</span><span class="v">${esc(r.description)}</span></div>
      ${r.content_subhead?`<div class="rc-l"><span class="k">소제목</span><span class="v">${esc(r.content_subhead)}</span></div>`:""}
      <div class="rc-f">📌 ${(r.fact||[]).map(esc).join(" · ")}</div>
      <div class="rc-f"><button class="btn sm" data-feedback-action="accepted" data-recommendation-id="${esc(r.fingerprint)}" data-product="${esc(r.product)}">채택</button> <button class="btn sm" data-feedback-action="edit_requested" data-recommendation-id="${esc(r.fingerprint)}" data-product="${esc(r.product)}">수정 필요</button> <button class="btn sm" data-feedback-action="rejected" data-recommendation-id="${esc(r.fingerprint)}" data-product="${esc(r.product)}">반려</button></div>
    </div>`).join(""):`<div class="banner">현재 표시할 추천 소재가 없습니다.</div>`;
  $("#content").innerHTML=`
    <div class="banner">시즌·뉴스·검색 수요를 반영한 추천입니다. 상품 내용과 심의를 확인한 뒤 사용하세요.</div>
    <div class="rc-wrap">${cards}</div>`;
}

const dayAge=s=>{const d=new Date(`${s}T00:00:00`);return Number.isNaN(d.getTime())?null:Math.max(0,Math.floor((Date.now()-d.getTime())/86400000));};
function serpMonitorPanel(p){
  const s=serpIdeas(p),age=dayAge(s.latest),stale=age===null||age>14;
  const ads=s.observed.slice(0,4).map(o=>`<div class="serp-ad"><b>${esc(o.brand||"경쟁사")} · ${esc(o.keyword||"키워드 미기록")}</b><p>${esc(o.title||"—")}<br>${esc(o.desc||"—")}</p><small>${esc(o.date||"날짜 미기록")}${o.rank?` · ${esc(o.rank)}위`:""}</small></div>`).join("");
  const ideas=s.candidates.map((o,i)=>`<div class="serp-ad"><b>${i+1}. ${esc(o.strategy)} <span class="source-pill">심의안 후보</span></b>
      <div class="wk-copy"><span class="k">제목</span><span class="v">${esc(o.title)}</span><span class="wx-len">${clen(o.title)}/${SPEC.titleMax}</span></div>
      <div class="wk-copy"><span class="k">설명</span><span class="v">${esc(o.desc)}</span><span class="wx-len">${clen(o.desc)}/${SPEC.descMax}</span></div>
      <small>${esc(o.why)}</small></div>`).join("");
  return `<div class="sec-lbl">🔎 경쟁사 광고와 SA 제안</div>
    <div class="serp-grid">
      <section class="serp-card"><h3>경쟁사 광고 <span class="${stale?"stale":"fresh"}">${stale?"업데이트 필요":"최신"}</span></h3>
        <p>${esc(s.latest||"기준일 없음")}${age!==null?` · ${age}일 전`:""}</p>${ads||'<p>수집된 경쟁사 광고가 없습니다.</p>'}</section>
      <section class="serp-card"><h3>제안 기준</h3><p>경쟁사 공통 소구: <b>${s.common.map(esc).join(" · ")||"없음"}</b><br>주요 검색어: <b>${esc(s.demand)}</b><br>추천 소구: <b>${esc(s.angle)}</b></p></section>
      <section class="serp-card"><h3>SA 소재 제안</h3>${ideas||'<p>현재 제안할 소재가 없습니다.</p>'}</section>
    </div>`;
}

function render(){
  if(curKey==="__reco"){renderReco();renderSidebar();window.scrollTo({top:0});return;}
  if(curKey==="__cal"){renderCalendar();renderSidebar();window.scrollTo({top:0});return;}
  if(curKey==="__brand"){renderBrand();renderSidebar();window.scrollTo({top:0});return;}
  const p=getP(curKey), s=buildSheet(p), batch=buildNaverRows(p,50);
  $("#pt").textContent=p.name+" · 파워링크 소재"; $("#pts").textContent=`· ${PLANM}월·${planNext()}월 플랜 + 실측 검색량`;
  const ev=EVIDENCE[p.key];
  const evPanel = ev ? `<div class="ev">
    <div class="ev-row"><span class="ev-lb news">📰 뉴스 동향</span><div class="ev-tx">${esc(ev.news)}</div></div>
    <div class="ev-row"><span class="ev-lb comp">🎯 경쟁사 소구(SERP)</span><div class="ev-tx">${ev.comps.map(c=>`<b>${esc(c.who)}</b> ${esc(c.hook)}`).join("<br>")}</div></div>
    ${AD_ANALYSIS[p.key]?`<div class="ev-row"><span class="ev-lb comp">경쟁사 광고 요약</span><div class="ev-tx">공통 소구: ${(AD_ANALYSIS[p.key].common_soju||[]).map(esc).join(", ")||"—"}<br>프로모션: ${(AD_ANALYSIS[p.key].promos||[]).slice(0,4).map(x=>esc(x[0])).join(" · ")||"—"} · 가격 표현: ${(AD_ANALYSIS[p.key].prices||[]).map(esc).join(" · ")||"—"}</div></div>`:""}
    <div class="ev-row"><span class="ev-lb ours">✅ 우리 대응 각도</span><div class="ev-tx">${esc(ev.ours)}</div></div>
    <div class="ev-links"><a href="news-tool.html" target="_blank" rel="noopener">뉴스 콘솔 ↗</a> · <a href="serp-tool.html" target="_blank" rel="noopener">SERP 아카이브 ↗</a></div>
  </div>` : "";
  const vols=topVol(p.key,6);
  const volPanel = vols.length ? `<div class="ev">
    <div class="ev-row"><span class="ev-lb vol">📊 실측 월검색량</span><div class="ev-tx">기준 ${esc(VOL.asof||"—")} · 검색광고 API(PC+모바일) — <b>수요 높은 키워드</b>를 제목·소구에 우선 반영<br>${vols.map(v=>`<span class="volkw"><b>${esc(v.kw)}</b> ${fmtN(v.total)}회 <i class="cbadge ${compCls(v.comp)}">${esc(v.comp||"-")}</i></span>`).join(" ")}</div></div>
  </div>` : "";
  const seasonChips = s.issues.length ? s.issues.map(o=>`<span class="spec">🗓 <b>${esc(shortWord(o.tag))}</b> · ${esc(proxLabel(o))}</span>`).join("") : "";
  $("#content").innerHTML=`
    <div class="banner"><b>${PLANM}월→${planNext()}월 소재</b> · 상품 내용과 심의를 확인한 뒤 사용하세요.</div>
    <div class="xbar">
      <button class="btn xbtn" id="xExcel">⬇ 실제 포맷 심의안 초안</button>
      <button class="btn" id="xAds">⬇ 현재 상품 내부 검토 CSV (${batch.length}/50)</button>
      <button class="btn" id="xAllAds">⬇ 전체 13상품 내부 검토 CSV (650행)</button>
      <span class="xnote">첨부 심의안 기준 광고제목·추가제목·설명·홍보문구·서브링크·이미지형 서브링크 · <span style="color:var(--bad);font-weight:800">빨강=신규 T&amp;D</span></span>
      <div class="tpl"><b>공식 템플릿 열 매핑</b><input id="naverTpl" type="file" accept=".csv,.tsv,.txt"><button class="btn sm" id="xOfficial" ${NAVER_TEMPLATE?"":"disabled"}>현재 상품 50행 변환</button><span class="${NAVER_TEMPLATE?"ok":NAVER_TEMPLATE_MESSAGE.startsWith("오류")?"no":""}">${esc(NAVER_TEMPLATE?`${NAVER_TEMPLATE.name} · 필수 열 매핑 완료`:NAVER_TEMPLATE_MESSAGE)}</span></div>
    </div>
    <div class="specbar">
      <div class="spec">제목·추가제목 <b>≤${SPEC.titleMax}</b></div>
      <div class="spec">설명 <b>${SPEC.descMin}~${SPEC.descMax}</b></div>
      <div class="spec">홍보문구 <b>≤${SPEC.promoMax}</b></div>
      <div class="spec">서브링크 <b>≤${SPEC.subMax}</b>·${SPEC.subMinCount}~${SPEC.subMaxCount}개</div>
      ${seasonChips}
    </div>
    <div class="banner"><b>소재 가이드 ${esc(MATERIAL_SPEC.verifiedAt)} · 보험광고 사전검수 ${esc(AD_REVIEW.verifiedAt)}</b> · 자동 차단·근거 필요·필수 고지 필요 표현은 소재 생성에서 제외합니다. 결과는 협회·준법 승인이 아니며 상품자료·약관·랜딩을 사람이 확인해야 합니다. <a href="${esc(AD_REVIEW.sources.knia.url)}" target="_blank" rel="noopener">손해보험협회 심의시스템 ↗</a> · <a href="${esc(MATERIAL_SPEC.guideUrl)}" target="_blank" rel="noopener">네이버 등록 가이드 ↗</a></div>

    <div class="sec-lbl">📌 상품·시장 참고</div>
    ${volPanel}
    ${evPanel}
    ${p.cat==="사이트"?"":serpMonitorPanel(p)}

    ${block("2. 광고 제목",s.brand,SPEC.titleMax)}
    ${block("3. 추가제목 (롤링)",s.subt,SPEC.additionalTitleMax,true)}
    ${block("4. 설명 (롤링)",s.desc,SPEC.descMax,true)}
    ${block("5. 홍보문구 (택 1)",s.promo,SPEC.promoMax)}
    ${block("6. 서브링크 (택 4)",s.sub,SPEC.subMax)}

    ${weatherSection(p)}

    <div class="note">내보낸 파일은 내부 검토용입니다. 등록 전 서브링크명과 실제 URL의 일치 여부, 필수값, 상품 근거와 심의 상태를 확인하세요.</div>`;

  $("#xExcel").addEventListener("click",()=>exportXls(p));
  $("#xAds").addEventListener("click",()=>exportReviewAds([p],p.name));
  $("#xAllAds").addEventListener("click",()=>exportReviewAds(PRODUCTS,"전체13상품"));
  $("#xOfficial").addEventListener("click",()=>exportOfficialTemplate(p));
  $("#naverTpl").addEventListener("change",async e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    try{NAVER_TEMPLATE=await readNaverTemplate(file);NAVER_TEMPLATE_MESSAGE="";toast("공식 템플릿 필수 열 매핑 완료");}
    catch(err){NAVER_TEMPLATE=null;NAVER_TEMPLATE_MESSAGE=`오류 · ${err.message||err}`;toast(NAVER_TEMPLATE_MESSAGE);}
    render();
  });
  renderSidebar();
}
document.addEventListener("click",e=>{
  const bz=e.target.closest("[data-bzoom]"); if(bz){$("#lbImg").src=bz.dataset.bzoom;$("#lbCap").textContent=bz.dataset.bcap||"";$("#lb").classList.add("show");return;}
  if(e.target.closest("#lb")){$("#lb").classList.remove("show");return;}
  const nav=e.target.closest("[data-key]"); if(nav){curKey=nav.dataset.key;render();window.scrollTo({top:0});return;}
  const fb=e.target.closest("[data-feedback-action]");if(fb){
    window.ModooFeedback?.record({action:fb.dataset.feedbackAction,tool:"adcopy",productKey:fb.dataset.product||curKey,recommendationId:fb.dataset.recommendationId||"",sourceVersion:RECO.asof||"",reviewStatus:"사람 검토 전 운영 후보"})
      .then(result=>toast(result&&result.sent?"피드백 기록 완료":"피드백 저장소 미연결 · docs/feedback-loop.md 확인"))
      .catch(()=>toast("피드백 기록 실패"));return;
  }
});
$("#themeBtn").addEventListener("click",()=>{const c=document.documentElement.getAttribute("data-theme");const d=c?c==="dark":matchMedia("(prefers-color-scheme:dark)").matches;document.documentElement.setAttribute("data-theme",d?"light":"dark");try{localStorage.setItem("mf_theme",d?"light":"dark")}catch(_){};});
$("#planMonth").innerHTML=PLANNING.optionMarkup(PLANM);
$("#planMonth").addEventListener("change",e=>{PLANM=PLANNING.setMonth(e.target.value);render();});
render();
Promise.all([loadBrandManifest(),loadVolume(),loadSignals(),loadSeasonal()]).then(()=>{renderSidebar();render();}); // 경쟁사 브랜드검색 + 실측 검색량 + 기상특보 + 연간플랜
// 실측 관측 소재 분석(있으면) — 생성 문구의 경쟁 공통 소구 회피·차별 근거
fetch("serp/ad_analysis.json").then(r=>r.ok?r.json():null).then(d=>{if(d&&d.products){AD_META={asof:d.asof||"",window_days:d.window_days||35};AD_ANALYSIS=d.products;render();}}).catch(()=>{});
fetch("data/adcopy/serp-candidates.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{
  if(d&&d.products){SERP_AGENT=Object.fromEntries(d.products.map(x=>[x.product_key,x]));render();}
}).catch(()=>{});
// 근거 기반 추천 소재(event_engine 산출물 · 연간플랜에서 병합) — 사이드바 카운트·본문 갱신
fetch("data/events/recommendations.json").then(r=>r.ok?r.json():null).then(d=>{if(d&&d.recommendations){RECO=d;renderSidebar();if(curKey==="__reco")render();}}).catch(()=>{});
</script>
</body>
</html>
